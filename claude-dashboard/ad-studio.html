<style>
/* Layout: één kolom genummerde ad-kaarten (foto boven, copy eronder), sleepvlak bovenaan, brede schermen twee kolommen. */
:root {
  --bg: #f4f2ec;
  --surface: #fcfcfb;
  --surface-2: #efece4;
  --line: #e3e0d7;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #7a7974;
  --accent: #0b0b0b;
  --accent-ink: #ffffff;
  --good: #1f7a1f;
  --warn: #a15c00;
  --bad: #c53030;
  --focus: #2a78d6;
  --display: "Playfair Display", Georgia, "Times New Roman", serif;
  --body: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111110; --surface: #1a1a19; --surface-2: #242421; --line: #33322e;
    --ink: #f5f3ee; --ink-2: #c3c2b7; --ink-3: #8f8e86; --accent: #e3e0d7; --accent-ink: #0b0b0b;
    --good: #4cbf4c; --warn: #e0a030; --bad: #ef6b6b; --focus: #3987e5; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111110; --surface: #1a1a19; --surface-2: #242421; --line: #33322e;
  --ink: #f5f3ee; --ink-2: #c3c2b7; --ink-3: #8f8e86; --accent: #e3e0d7; --accent-ink: #0b0b0b;
  --good: #4cbf4c; --warn: #e0a030; --bad: #ef6b6b; --focus: #3987e5; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 72rem; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; display: flex; flex-direction: column; gap: 20px; }
h1, .serif { font-family: var(--display); font-weight: 500; letter-spacing: -0.01em; }
h1 { font-size: clamp(1.7rem, 4vw, 2.3rem); margin: 0; text-wrap: balance; }
h1 i { font-style: italic; }
.sub { color: var(--ink-2); margin: 4px 0 0; max-width: 60ch; }
.eyebrow { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-3); }

.drop { border: 1.5px dashed var(--ink-3); border-radius: 16px; background: var(--surface); padding: 28px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; transition: background .15s, border-color .15s; }
.drop.over, body.dragging .drop { border-color: var(--ink); background: var(--surface-2); }
.drop .big { font-family: var(--display); font-size: 1.35rem; }
.drop p { margin: 0; color: var(--ink-2); max-width: 52ch; }

.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.bar .grow { flex: 1 1 auto; }
.count { color: var(--ink-2); font-variant-numeric: tabular-nums; font-size: 14px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 9px; padding: 8px 14px; font: 500 14px var(--body); background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); cursor: pointer; white-space: nowrap; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, select:focus-visible, .link:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
select { font: 14px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; }
.link { background: none; border: 0; padding: 0; font: inherit; font-size: 13px; color: var(--ink-2); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.note { font-size: 13px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.note.warn { border-color: color-mix(in srgb, var(--warn) 50%, transparent); }

.grid { display: grid; gap: 18px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 900px) { .grid { grid-template-columns: 1fr 1fr; } }
.ad { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.ad .top { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
.num { font-family: var(--display); font-size: 1.6rem; line-height: 1; min-width: 2.2ch; font-variant-numeric: tabular-nums; }
.ad .name { font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.photo { background: var(--surface-2); display: block; width: 100%; max-width: 100%; max-height: 78vh; object-fit: contain; }
.body { padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.chip.strong { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.hook { font-family: var(--display); font-size: 1.25rem; line-height: 1.3; margin: 0; text-wrap: balance; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field .head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.field .label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.field .val { white-space: pre-line; overflow-wrap: anywhere; user-select: text; }
.scene { font-size: 13px; color: var(--ink-2); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-top: 1px solid var(--line); padding-top: 12px; }
.actions .right { margin-left: auto; }
.writing { color: var(--ink-2); display: flex; align-items: center; gap: 10px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-2); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
.err { color: var(--bad); font-size: 14px; }
.empty { text-align: center; color: var(--ink-2); padding: 24px 0; }
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--accent); color: var(--accent-ink); padding: 8px 14px; border-radius: 10px; font-size: 14px; z-index: 10; }
.confirm { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-2); }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">ModernoMilano</div>
    <h1>Ad <i>Studio</i></h1>
    <p class="sub">Sleep je ad-foto's hierin. Elke foto krijgt een nummer in de volgorde waarin je hem toevoegt, en daaronder een eigen ad copy over precies die foto, met angle en hook om te testen.</p>
  </header>

  <label class="drop" id="drop" for="file">
    <span class="big">Sleep foto's hierheen</span>
    <p>Of klik om ze te kiezen. Meerdere tegelijk mag: ze worden op bestandsnaam gesorteerd en daarna doorgenummerd.</p>
    <span class="btn" aria-hidden="true">Foto's kiezen</span>
    <input id="file" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
  </label>

  <div class="bar">
    <span class="count" id="count">Nog geen ads</span>
    <span class="grow"></span>
    <label class="count" for="lang">Taal</label>
    <select id="lang">
      <option value="English">English</option>
      <option value="Dutch">Nederlands</option>
      <option value="German">Deutsch</option>
    </select>
    <button class="btn ghost" id="copyAll" type="button">Kopieer alle copy</button>
    <button class="btn ghost" id="csv" type="button" hidden>Download CSV</button>
  </div>
  <div id="notes"></div>

  <section class="grid" id="grid" aria-live="polite"></section>
</div>
<div class="toast" id="toast" role="status" hidden></div>

const BRIEF = `You write Meta (Facebook/Instagram) ad copy for ModernoMilano, a premium menswear brand "inspired by Milan".
You get ONE finished ad image. Look at it carefully: the garment, its colours, the setting, the light, any detail.

Write one conversion-focused ad that is clearly about THIS photo: name the garment and its colour and use one concrete visual detail you can see.
If you cannot tell which product it is, focus the copy on one of the three priority collections: Cashmere, Reverso Collection, or Bundle & Save.

Voice: calm, confident, quiet luxury. Short lines. Italian touches sparingly (Milano, Como, Brera). No hype stacks, no ALL CAPS sentences, at most one emoji (usually none), no em-dashes. Like a well-dressed friend, not a discount bin.

Facts you may use (never invent others):
- Free worldwide shipping on every order, no minimum
- Order before 23:00, shipped the same day

- Secure checkout

Never mention Klarna or pay-later. Never invent discounts, percentages, stock levels, countdowns or review quotes. If the image itself shows a discount or claim, do not repeat it.
Cashmere pieces are a soft cashmere blend: never "100% cashmere" or "pure cashmere". Reverso gilets are fully reversible (two colours, one gilet).

Catalogue (EUR):
- REVERSO COLLECTION (new drop Oct 2026): Milano Reverso Set = fully reversible gilet + Mercer tee + Milano Classico pants, EUR 200. Colourways: Crema & Bordeaux, Bordeaux & Crema, Total Bordeaux, Pietra & Antracite, Antracite & Pietra, Total Antracite, Crema & Nero, Total Nero, Total Marrone, Cammello & Marrone, Marrone & Cammello, Total Oliva, Oliva & Crema, Crema & Oliva, Total Blu, Crema & Blu, Blu & Crema (first colour = outside). Earlier Reverso sets EUR 140-190. Milano Reverso Gilet alone EUR 70. Signature Reversible Jacket EUR 100.
- CASHMERE: Knitted Cashmere Set EUR 150 (Champagne, Navy). Cashmere Lounge Set EUR 150 (Beige, Gray, Navy, Black). Knitted Two-Tone Cashmere Set EUR 250 (Navy, Grey, Dark Mocha, Black). Cashmere Full Zip Cardigan EUR 220. Verona Cardigan EUR 185. Cashmere polos EUR 120 (Sorrento Polo EUR 200). Bellagio knit EUR 150. Vela knit EUR 110. Camicia EUR 175. Torino Blazer EUR 180. Cashmere & Loafer Sets.
- BUNDLE & SAVE: the complete sets (Reverso sets, Oliva Set EUR 140, Sabbia/Nero Set EUR 130, Amalfi/Tortora/Notte Set EUR 150, cashmere sets). Pitch: the full outfit in one order costs less than the pieces one by one. Never state a % or euro saving.
- Other: Linen Set EUR 90, Hooded Jacket EUR 80, Capri Gilet EUR 60, Knit Polo EUR 50, Mercer Tee EUR 40.
If unsure of the exact product, describe it as it looks; never guess a wrong name or price (leave price "" then).

Angles (pick exactly one): two-in-one, quiet-luxury, price-vs-quality, complete-look, bundle-value, softness, occasion, season, detail, social-proof, risk-free, identity, gift, new-drop (only for the new Reverso Set colourways).
Hook types (pick one): question, bold claim, contrast, POV, specific fact, scene-setting, callout, objection-handling. The hook is the first line of the primary text, max 12 words, and must stop the scroll on its own.`;

const ANGLE_NL = { "two-in-one": "Twee in één", "quiet-luxury": "Quiet luxury", "price-vs-quality": "Prijs vs kwaliteit", "complete-look": "Complete look", "bundle-value": "Bundle-voordeel", softness: "Zachtheid", occasion: "Moment", season: "Seizoen", detail: "Detail", "social-proof": "Social proof", "risk-free": "Zonder risico", identity: "Identiteit", gift: "Cadeau", "new-drop": "Nieuwe drop" };
const CTA = { SHOP_NOW: "Shop now", LEARN_MORE: "Learn more", ORDER_NOW: "Order now", GET_OFFER: "Get offer" };

const $ = (s) => document.querySelector(s);
const grid = $("#grid"), notes = $("#notes");
const state = { ads: new Map(), local: new Map(), lang: "English" }; // key -> record; local: key -> {url, blob}
let db = null, assets = null, sample = null, downloads = null, persistent = false, imagesOk = false;
let queue = [], running = 0;
const active = new Set();
const MAX_PARALLEL = 2;

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 1800); }
async function copyText(text, label) {
  try { await navigator.clipboard.writeText(text); toast(label + " gekopieerd"); }
  catch { toast("Kopiëren lukte niet, selecteer de tekst zelf"); }
}
function keyOf(n) { return String(n).padStart(5, "0"); }
function nextNumber() { let m = 0; for (const a of state.ads.values()) m = Math.max(m, a.n || 0); return m + 1; }
function idFromName(name) { const m = name.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i); return m ? m[0].toLowerCase() : null; }

async function shrink(file) {
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  c.getContext("2d").drawImage(bmp, 0, 0, w, h);
  const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.86));
  return { blob, w, h };
}

/* ---------- opslaan ---------- */
async function save(key, patch) {
  const rec = { ...(state.ads.get(key) || {}), ...patch };
  state.ads.set(key, rec);
  render();
  if (persistent) {
    try { await db.collection("ads").doc(key).set(stripLocal(rec)); }
    catch (e) { note("Opslaan lukte niet (" + (e.code || "fout") + "). De copy staat wel op je scherm.", true); }
  }
}
function stripLocal(rec) { const { _local, ...rest } = rec; return rest; }

/* ---------- toevoegen ---------- */
async function addFiles(fileList) {
  const files = [...fileList].filter((f) => /^image\/(jpeg|png|webp)$/.test(f.type));
  if (!files.length) { toast("Alleen JPG, PNG of WebP"); return; }
  files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" }));
  let n = nextNumber();
  for (const file of files) {
    const key = keyOf(n);
    const localUrl = URL.createObjectURL(file);
    state.local.set(key, { url: localUrl, file });
    await save(key, { n, name: file.name, status: "writing", createdAt: new Date().toISOString() });
    n++;
    enqueue(key);
    uploadPhoto(key, file);
  }
}

async function uploadPhoto(key, file) {
  if (!assets) return;
  try {
    const { blob } = await shrink(file);
    const res = await assets.upload(blob, { type: "image/jpeg" });
    await save(key, { asset: res.id });
  } catch (e) {
    note("Foto " + (state.ads.get(key)?.n ?? "") + " kon niet worden opgeslagen (" + (e.code || "fout") + "). Hij blijft zichtbaar tot je de pagina sluit.", true);
  }
}

/* ---------- copy schrijven ---------- */
function enqueue(key) { if (!queue.includes(key)) queue.push(key); pump(); }
function pump() {
  while (running < MAX_PARALLEL && queue.length) {
    const key = queue.shift(); running++;
    write(key).finally(() => { running--; render(); pump(); });
  }
}

function usedSoFar(exceptKey) {
  const hooks = [], angles = {};
  for (const [k, a] of state.ads) {
    if (k === exceptKey || !a.copy) continue;
    hooks.push(a.copy.hook);
    angles[a.copy.angle] = (angles[a.copy.angle] || 0) + 1;
  }
  return { hooks: hooks.slice(-60), angles };
}

async function write(key, opts = {}) {
  if (active.has(key)) return;
  active.add(key);
  try { await writeInner(key, opts); } finally { active.delete(key); }
}
async function writeInner(key, { fresh = false } = {}) {
  const rec = state.ads.get(key); if (!rec) return;
  const pre = !fresh && state.lang === "English" && PREWRITTEN[idFromName(rec.name || "")];
  if (pre) { await save(key, { status: "done", copy: pre, source: "vooraf geschreven", error: null }); return; }
  if (!sample || !imagesOk) { await save(key, { status: "error", error: "Copy schrijven werkt hier niet: Claude kan in deze weergave geen foto's bekijken." }); return; }
  const local = state.local.get(key);
  let image = local?.file || null;
  if (!image && rec.asset) {
    try { image = await (await fetch("/_blob/" + rec.asset)).blob(); } catch { image = null; }
  }
  if (!image) { await save(key, { status: "error", error: "De foto is niet meer beschikbaar. Sleep hem opnieuw in de pagina." }); return; }
  await save(key, { status: "writing", error: null });
  const used = usedSoFar(key);
  const prompt = `${BRIEF}

Write the ad in ${state.lang}${state.lang === "Dutch" ? " (natural Dutch for the Netherlands and Belgium, use \"je\", keep product names as they are)" : ""}. Keep the "scene_nl" field in Dutch.
This is ad number ${rec.n}. File name: ${rec.name || "unknown"}.
Angles already used in this set (spread the test, prefer angles used least): ${JSON.stringify(used.angles)}
Hooks already used (yours must be clearly different): ${JSON.stringify(used.hooks)}

Reply with only one JSON object with exactly these keys:
{"collection":"Cashmere"|"Reverso"|"Bundle & Save"|"Other","product":"","price":"EUR 200 or empty","scene_nl":"one short Dutch sentence: what is in the photo","angle":"","hook_type":"","hook":"","primary_text":"starts with the hook line; 3-6 short lines separated by \\n; ends with a clear call to action; 1-2 of the facts above","headline":"max 40 characters","description":"max 30 characters","cta":"SHOP_NOW"|"LEARN_MORE"|"ORDER_NOW"|"GET_OFFER"}`;
  try {
    const out = await sample.json(prompt, { images: [image], cache: fresh ? false : undefined });
    if (!out || typeof out.primary_text !== "string" || typeof out.hook !== "string") throw { code: "invalid_json" };
    const copy = {
      collection: String(out.collection || "Other"), product: String(out.product || ""), price: String(out.price || ""),
      scene_nl: String(out.scene_nl || ""), angle: String(out.angle || ""), hook_type: String(out.hook_type || ""),
      hook: String(out.hook), primary_text: String(out.primary_text), headline: String(out.headline || ""),
      description: String(out.description || ""), cta: String(out.cta || "SHOP_NOW"),
    };
    await save(key, { status: "done", copy, source: "Claude", lang: state.lang, error: null });
  } catch (e) {
    const msg = {
      not_granted: "Je hebt Claude geen toestemming gegeven voor deze pagina. Herlaad en kies Toestaan om copy te laten schrijven.",
      sampling_disabled: "Claude is niet beschikbaar voor dit account.",
      rate_limited: "Even te veel tegelijk. Wacht een minuut en klik op Opnieuw schrijven.",
      image_rejected: "Deze foto kon niet worden gelezen. Probeer een JPG of PNG.",
      invalid_json: "Het antwoord was onvolledig. Klik op Opnieuw schrijven.",
      refused: "Claude wilde voor deze foto geen copy schrijven. Probeer een andere foto.",
    }[e?.code] || "Schrijven lukte niet. Klik op Opnieuw schrijven.";
    if (e?.code === "not_granted" || e?.code === "sampling_disabled") queue = [];
    await save(key, { status: "error", error: msg });
  }
}

/* ---------- weergave ---------- */
function note(text, warn) {
  const d = document.createElement("div"); d.className = "note" + (warn ? " warn" : ""); d.textContent = text;
  notes.append(d); setTimeout(() => d.remove(), 12000);
}
function photoUrl(key, rec) { return state.local.get(key)?.url || (rec.asset ? "/_blob/" + rec.asset : ""); }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function field(label, value, copyLabel) {
  const f = el("div", "field");
  const head = el("div", "head");
  head.append(el("span", "label", label));
  const b = el("button", "link", "Kopieer"); b.type = "button"; b.onclick = () => copyText(value, copyLabel || label);
  head.append(b);
  f.append(head, el("div", "val", value));
  return f;
}

function adText(rec) {
  const c = rec.copy; if (!c) return "";
  return `#${rec.n}\n${c.primary_text}\n\nHeadline: ${c.headline}\nDescription: ${c.description}\nCTA: ${CTA[c.cta] || c.cta}`;
}

function card(key, rec) {
  const a = el("article", "ad"); a.id = "ad-" + key;
  const top = el("div", "top");
  top.append(el("span", "num", "#" + rec.n), el("span", "name", rec.name || ""));
  a.append(top);
  const src = photoUrl(key, rec);
  if (src) { const img = el("img", "photo"); img.src = src; img.alt = rec.copy?.scene_nl || "Ad-foto " + rec.n; img.loading = "lazy"; a.append(img); }
  else a.append(el("div", "note", "Deze foto is niet opgeslagen. Sleep hem opnieuw in de pagina om hem te zien."));
  const body = el("div", "body");
  const busy = active.has(key) || queue.includes(key);
  if (busy) {
    const w = el("div", "writing"); w.append(el("span", "dot"), el("span", null, queue.includes(key) ? "Wacht op zijn beurt…" : "Claude bekijkt de foto en schrijft de copy…"));
    body.append(w);
  } else if (rec.status === "writing" && !rec.copy) {
    body.append(el("div", "err", "Het schrijven is onderbroken. Klik op Opnieuw schrijven."));
  }
  if (rec.status === "error") body.append(el("div", "err", rec.error || "Er ging iets mis."));
  const c = rec.copy;
  if (c) {
    const chips = el("div", "chips");
    chips.append(el("span", "chip strong", c.collection === "Other" ? "Overig" : c.collection));
    if (c.angle) chips.append(el("span", "chip", "Angle: " + (ANGLE_NL[c.angle] || c.angle)));
    if (c.hook_type) chips.append(el("span", "chip", "Hook: " + c.hook_type));
    if (c.product) chips.append(el("span", "chip", c.product + (c.price ? " · " + c.price.replace("EUR ", "€ ") : "")));
    body.append(chips);
    body.append(el("p", "hook", c.hook));
    if (c.scene_nl) body.append(el("div", "scene", "Op de foto: " + c.scene_nl));
    body.append(field("Primaire tekst", c.primary_text), field("Kop", c.headline), field("Beschrijving", c.description));
    const ctaRow = el("div", "field"); const h = el("div", "head"); h.append(el("span", "label", "Knop"), el("span", null, CTA[c.cta] || c.cta)); ctaRow.append(h); body.append(ctaRow);
  }
  const act = el("div", "actions");
  if (c) { const b = el("button", "btn small", "Kopieer alles"); b.type = "button"; b.onclick = () => copyText(adText(rec), "Ad #" + rec.n); act.append(b); }
  {
    const r = el("button", "btn ghost small", c ? "Andere versie" : "Opnieuw schrijven"); r.type = "button";
    r.disabled = busy;
    r.onclick = () => { write(key, { fresh: true }); render(); };
    act.append(r);
  }
  const del = el("button", "link right", "Verwijderen"); del.type = "button";
  del.onclick = () => {
    const box = el("span", "confirm", "Ad #" + rec.n + " verwijderen?");
    const yes = el("button", "btn small", "Ja"); yes.type = "button";
    const no = el("button", "btn ghost small", "Nee"); no.type = "button";
    yes.onclick = () => removeAd(key); no.onclick = render;
    box.append(yes, no); del.replaceWith(box);
  };
  act.append(del);
  body.append(act);
  a.append(body);
  return a;
}

async function removeAd(key) {
  const rec = state.ads.get(key);
  state.ads.delete(key); queue = queue.filter((k) => k !== key);
  render();
  if (persistent) {
    try { await db.collection("ads").doc(key).delete(); if (rec?.asset && assets) await assets.delete(rec.asset); }
    catch (e) { note("Verwijderen is niet helemaal gelukt (" + (e.code || "fout") + ").", true); }
  }
}

function render() {
  const list = [...state.ads.entries()].sort((a, b) => a[1].n - b[1].n);
  const done = list.filter(([, r]) => r.copy).length;
  $("#count").textContent = list.length ? `${list.length} ${list.length === 1 ? "ad" : "ads"} · ${done} met copy` : "Nog geen ads";
  if (!list.length) { grid.replaceChildren(el("p", "empty", "Je ads verschijnen hier, genummerd in de volgorde waarin je ze toevoegt.")); return; }
  const focused = document.activeElement?.closest?.(".ad")?.id;
  grid.replaceChildren(...list.map(([k, r]) => card(k, r)));
  if (focused) document.getElementById(focused)?.querySelector("button")?.focus({ preventScroll: true });
}

/* ---------- alles exporteren ---------- */
$("#copyAll").onclick = () => {
  const list = [...state.ads.values()].filter((r) => r.copy).sort((a, b) => a.n - b.n);
  if (!list.length) { toast("Nog geen copy om te kopiëren"); return; }
  copyText(list.map(adText).join("\n\n----------\n\n"), "Alle copy");
};
function csvCell(v) { return '"' + String(v ?? "").replace(/"/g, '""') + '"'; }
$("#csv").onclick = async () => {
  const list = [...state.ads.values()].filter((r) => r.copy).sort((a, b) => a.n - b.n);
  if (!list.length) { toast("Nog geen copy om te downloaden"); return; }
  const head = ["nummer", "bestand", "collectie", "product", "prijs", "angle", "hook_type", "hook", "primary_text", "headline", "description", "cta"];
  const rows = list.map((r) => [r.n, r.name, r.copy.collection, r.copy.product, r.copy.price, r.copy.angle, r.copy.hook_type, r.copy.hook, r.copy.primary_text, r.copy.headline, r.copy.description, r.copy.cta].map(csvCell).join(","));
  try { await downloads.save({ filename: "modernomilano-ad-copy.csv", data: "﻿" + [head.join(","), ...rows].join("\n") }); }
  catch (e) { if (e?.code !== "declined") toast("Downloaden lukte niet"); }
};

/* ---------- slepen ---------- */
const drop = $("#drop");
$("#file").addEventListener("change", (e) => { addFiles(e.target.files); e.target.value = ""; });
let depth = 0;
window.addEventListener("dragenter", (e) => { if ([...(e.dataTransfer?.types || [])].includes("Files")) { depth++; document.body.classList.add("dragging"); } });
window.addEventListener("dragleave", () => { depth = Math.max(0, depth - 1); if (!depth) document.body.classList.remove("dragging"); });
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => { e.preventDefault(); depth = 0; document.body.classList.remove("dragging"); if (e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files); });

$("#lang").addEventListener("change", (e) => {
  state.lang = e.target.value;
  try { localStorage.setItem("mm-studio-lang-v3", state.lang); } catch {}
});
try { const l = localStorage.getItem("mm-studio-lang-v3"); if (l) { state.lang = l; $("#lang").value = l; } } catch {}

render();

/* ---------- mogelijkheden van deze weergave ---------- */
(async () => {
  if (!window.claude?.use) { note("Open deze pagina in Claude om copy te laten schrijven en je ads te bewaren.", true); return; }
  [sample, db, assets, downloads] = await Promise.all(["sample", "db", "assets", "downloads"].map((n) => window.claude.use(n).catch(() => null)));
  if (sample) { try { imagesOk = !!(await sample.limits())?.images; } catch { imagesOk = false; } }
  if (!sample || !imagesOk) note("Claude kan in deze weergave geen foto's bekijken. Foto's uit Higgsfield met hun originele bestandsnaam krijgen wel meteen hun vooraf geschreven copy.", true);
  if (downloads) $("#csv").hidden = false;
  if (db && assets) {
    persistent = true;
    db.collection("ads").orderBy("n").onSnapshot((snap) => {
      for (const ch of snap.docChanges()) {
        const key = ch.doc.id;
        if (ch.type === "removed") state.ads.delete(key);
        else state.ads.set(key, { ...ch.doc.data() });
      }
      render();
    }, () => note("Je opgeslagen ads konden niet worden geladen. Nieuwe ads werken wel.", true));
  } else if (db || assets) {
    note("Bewaren werkt alleen voor de eigenaar van deze pagina. Je ads staan op je scherm tot je de pagina sluit.", true);
  } else {
    note("Je ads worden in deze weergave niet bewaard. Ze staan op je scherm tot je de pagina sluit.", true);
  }
})();
</script>
