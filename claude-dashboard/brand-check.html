<title>ModernoMilano Brand Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap">
<style>
/* Layout: sticky kop met tabbladen, daaronder per tabblad een samenvatting boven de details. Zelfde huisstijl als ModernoMilano Cijfers. */
:root{
  --bg:#f4f2ec;--surface:#fcfcfb;--surface-2:#efece4;--line:#e3e0d7;
  --text:#121210;--text-2:#52514e;--text-3:#7a7974;--accent:#121210;--accent-text:#fff;
  --grid:#e7e4dc;--neg:#c53030;--good:#1f7a1f;--warn:#9a5a00;--info:#2a78d6;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#4a3aa7;
  --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#111110;--surface:#1a1a19;--surface-2:#242421;--line:#33322e;--text:#f5f3ee;--text-2:#c3c2b7;--text-3:#8f8e86;
  --accent:#e3e0d7;--accent-text:#111110;--grid:#2c2b28;--neg:#ef6b6b;--good:#4cbf4c;--warn:#e0a030;--info:#3987e5;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#9085e9}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#111110;--surface:#1a1a19;--surface-2:#242421;--line:#33322e;--text:#f5f3ee;--text-2:#c3c2b7;--text-3:#8f8e86;
  --accent:#e3e0d7;--accent-text:#111110;--grid:#2c2b28;--neg:#ef6b6b;--good:#4cbf4c;--warn:#e0a030;--info:#3987e5;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#9085e9}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:0 48px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{margin:0;text-wrap:balance}
.serif{font-family:var(--serif)}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line);margin-bottom:18px}
.brandrow{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
.brand{font-family:var(--serif);font-size:22px;letter-spacing:-.01em}

nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav.tabs button{border:0;background:transparent;padding:7px 11px;border-radius:8px;color:var(--text-2);white-space:nowrap;cursor:pointer}
nav.tabs button[aria-current="page"]{background:var(--surface-2);color:var(--text);font-weight:600}
.seg{display:flex;max-width:100%;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;padding:5px 9px;border-radius:7px;color:var(--text-2);white-space:nowrap;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-text)}
.input{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 9px;min-width:0}
.input:focus,button:focus-visible,.seg button:focus-visible{outline:2px solid var(--info);outline-offset:1px}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:9px;padding:7px 13px;background:var(--accent);color:var(--accent-text);font-weight:500;cursor:pointer;white-space:nowrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h2{font-size:15px;font-weight:600;margin-bottom:4px}
.card .lead{color:var(--text-2);font-size:13px;margin:0 0 12px;max-width:80ch}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}

@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}

.neg{color:var(--neg)}.good{color:var(--good)}.warn{color:var(--warn)}.muted{color:var(--text-3)}.dim{color:var(--text-2)}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.headline{font-family:var(--serif);font-size:clamp(24px,4.2vw,36px);line-height:1.15;letter-spacing:-.01em}

.sub{color:var(--text-2);margin-top:8px;max-width:75ch}

.pill.good{background:color-mix(in srgb,var(--good) 12%,transparent);border-color:color-mix(in srgb,var(--good) 30%,transparent)}

.badge{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:0 6px;font-size:10.5px;line-height:17px;color:var(--text-3);white-space:nowrap;margin:1px 2px 1px 0}
.badge.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.badge.neg{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 40%,transparent)}
.pillar{display:flex;flex-direction:column;gap:8px}
.pillar .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pillar h3{font-size:14px;font-weight:600}
.score{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.score small{font-size:12px;color:var(--text-3);font-weight:400;margin-left:3px}
.meter{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:6px}
.pillar p{margin:0;color:var(--text-2);font-size:13px}
.big{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px 22px;align-items:center}
@media (max-width:620px){.big{grid-template-columns:minmax(0,1fr)}}
.ring{width:132px;height:132px}
.act{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:start}
.act:last-child{border-bottom:0}
.act .imp{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}

@media (max-width:560px){.act{grid-template-columns:minmax(0,1fr) auto}.act .area{grid-column:1/-1}}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.bar .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:5px}
.bar .v{font-variant-numeric:tabular-nums;white-space:nowrap;min-width:84px;text-align:right}
.funnel{display:flex;flex-direction:column;gap:6px}
.fstep{display:grid;grid-template-columns:150px minmax(0,1fr) 120px;gap:10px;align-items:center;font-size:13px}
@media (max-width:560px){.fstep{grid-template-columns:100px minmax(0,1fr) 92px}}
.fstep .track{height:22px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.fstep .track i{display:block;height:100%;background:var(--s1)}
.fstep .v{text-align:right;font-variant-numeric:tabular-nums}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chartlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-bottom:6px}
.chartlegend span{display:flex;align-items:center;gap:6px}
.chartlegend i{display:inline-block;width:14px;height:3px;border-radius:2px}
.tip{position:absolute;top:8px;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:12px;box-shadow:0 6px 24px rgba(0,0,0,.12);min-width:150px;z-index:2}
.tip div{display:flex;justify-content:space-between;gap:12px}
.strip{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:12.5px}
.strip .dot{font-size:9px}
.alert{border-left:4px solid var(--warn);padding:10px 12px;border-radius:10px;background:var(--surface);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:13px}
.alert.neg{border-left-color:var(--neg);color:var(--text)}
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.formgrid label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--text-2)}
.formgrid label .input{color:var(--text)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chat{display:flex;flex-direction:column;gap:10px}
.chatlog{max-height:min(62vh,600px);overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:2px}
.msg{max-width:min(760px,94%);padding:10px 13px;border-radius:12px;line-height:1.5;font-size:14px;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-text);white-space:pre-wrap}
.msg.assistant{align-self:flex-start;background:var(--surface-2)}
.msg p{margin:0 0 7px}.msg p:last-child{margin:0}.msg ul,.msg ol{margin:4px 0 7px;padding-left:20px}.msg li{margin:2px 0}.msg h4{margin:8px 0 4px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{white-space:normal;text-align:left;font-weight:400;font-size:13px}
.chatform{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.chatform textarea{flex:1 1 260px;resize:vertical;min-height:46px}
.todo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.todo.done b{text-decoration:line-through;color:var(--text-3)}
.todo input[type=checkbox]{width:17px;height:17px;margin-top:2px;accent-color:var(--text)}
.todo p{margin:2px 0 0;color:var(--text-2);font-size:13px}
.empty{padding:24px;text-align:center;color:var(--text-3)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-text);padding:9px 14px;border-radius:10px;z-index:50;max-width:calc(100% - 32px)}
details summary{cursor:pointer;color:var(--text-2)}
.note{font-size:12px;color:var(--text-3)}
.angleinput{width:150px;padding:3px 7px;font-size:12px}
.copytext{white-space:pre-wrap;font-size:12.5px;color:var(--text-2);max-height:7.5em;overflow:auto}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .25s ease-out}@keyframes fade{from{opacity:.4}to{opacity:1}}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brandrow">
      <div class="brand">Moderno<i>Milano</i><small>Brand check</small></div>
      <div class="row">
        <div class="seg" id="rangeSeg" role="group" aria-label="Periode"></div>
        <button class="btn ghost" id="refresh" type="button">Vernieuwen</button>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Onderdelen"></nav>
  </header>
  <section class="card" style="margin-bottom:16px"><div class="strip" id="strip"></div></section>
  <main id="view" class="stack"></main>
</div>
<div id="toast" class="toast" hidden></div>

<script>
"use strict";
/* ============================================================
   Basis
   ============================================================ */
const SHOP = "Shopify", WIN = "Windsor.ai", PP = "PayPal";
const LABEL = { [SHOP]: "Shopify", [WIN]: "Meta (Windsor.ai)", [PP]: "PayPal" };
const TABS = [["check", "Brand check"], ["ads", "Ads overzicht"], ["adlist", "Per ad"], ["angles", "Creatives & copy"], ["audience", "Doelgroep"], ["products", "Producten"], ["funnel", "Funnel & site"], ["markets", "Klanten & markten"], ["todo", "Actielijst"], ["advice", "Advies"], ["settings", "Instellingen"]];
const RANGES = [7, 14, 30, 60];
const DEFAULTS = { cogsPct: 30, shipPerOrder: 8, feePct: 3, targetProfitPct: 15, minSpendFactor: 1, cogsByProduct: {} };

const S = {
  tab: "check", range: 30,
  mcp: null, db: null, sample: null,
  settings: { ...DEFAULTS },
  angles: {}, actions: [],
  shop: { status: "wacht", err: null, at: null, q: {} },
  meta: { status: "wacht", err: null, at: null, q: {} },
  pp: { status: "wacht", err: null, disputes: null },
  sort: {}, adFilter: { q: "", verdict: "", market: "", type: "", status: "active" },
  chat: [], chatBusy: false, angleBusy: false,
};
try { const t = localStorage.getItem("bc.tab"); if (t && TABS.some((x) => x[0] === t)) S.tab = t; const r = Number(localStorage.getItem("bc.range")); if (RANGES.includes(r)) S.range = r; } catch {}
if (/^#[a-z]+$/.test(location.hash) && TABS.some((x) => "#" + x[0] === location.hash)) S.tab = location.hash.slice(1);

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const fmtEur = new Intl.NumberFormat("nl-NL", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
const fmtEur2 = new Intl.NumberFormat("nl-NL", { style: "currency", currency: "EUR", minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtInt = new Intl.NumberFormat("nl-NL", { maximumFractionDigits: 0 });
const eur = (n) => Number.isFinite(n) ? fmtEur.format(n) : "–";
const eur2 = (n) => Number.isFinite(n) ? fmtEur2.format(n) : "–";
const int = (n) => Number.isFinite(n) ? fmtInt.format(n) : "–";
const pct = (n, d = 1) => Number.isFinite(n) ? (n * 100).toLocaleString("nl-NL", { minimumFractionDigits: d, maximumFractionDigits: d }) + "%" : "–";
const times = (n) => Number.isFinite(n) ? n.toLocaleString("nl-NL", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "×" : "–";
const div = (a, b) => (b ? a / b : NaN);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = (arr, f) => arr.reduce((s, x) => s + (f ? f(x) : x), 0);
const dayKey = (d) => { const z = new Date(d); return `${z.getFullYear()}-${String(z.getMonth() + 1).padStart(2, "0")}-${String(z.getDate()).padStart(2, "0")}`; };
const addDays = (k, n) => { const d = new Date(k + "T12:00:00"); d.setDate(d.getDate() + n); return dayKey(d); };
const today = () => dayKey(new Date());
const signed = (n, f = pct) => (n > 0 ? "+" : "") + f(n);
let toastT;
function toast(t) { const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (el.hidden = true), 4200); }

/* ============================================================
   Koppelingen
   ============================================================ */
function errText(e, server) {
  const n = LABEL[server] || server;
  switch (e && e.code) {
    case "needs_reauth": return `Verbind ${n} opnieuw in claude.ai, Instellingen, Connectors.`;
    case "server_not_connected": case "server_not_found": return `${n} is niet gekoppeld aan je Claude-account. Voeg hem toe in claude.ai, Instellingen, Connectors.`;
    case "selection_required": return `Kies welke ${n}-koppeling deze pagina gebruikt.`;
    case "not_in_manifest": case "consent_required": return `${n} heeft nog geen toestemming voor deze pagina. Klik op Vernieuwen en sta ${n} toe.`;
    case "blocked_by_policy": return `${n} is geblokkeerd door de instellingen van je organisatie.`;
    case "approval_required": return `${n} vraagt om goedkeuring. Klik op Vernieuwen en keur de aanvraag goed.`;
    case "server_unavailable": return `${n} is even niet bereikbaar. Probeer het zo opnieuw.`;
    case "not_granted": case "capability_disabled": case "capability_removed": return "Koppelingen werken alleen als je deze pagina in claude.ai opent.";
    case "tool_error": return `${n} gaf een fout: ${String(e.message || "").slice(0, 160)}`;
    default: return `${n}: ${(e && e.message) || "onbekende fout"}`;
  }
}
async function call(server, tool, input, opts) {
  if (!S.mcp) throw { code: "not_granted", message: "geen koppelingen" };
  try { return await S.mcp.callTool(server, tool, input, opts); }
  catch (e) {
    if (e && e.retryable) { await new Promise((r) => setTimeout(r, Math.min(e.retryAfterMs || 1500, 8000) + Math.random() * 700)); return S.mcp.callTool(server, tool, input, opts); }
    throw e;
  }
}
function jsonOf(r, fits) {
  const c = [r && r.payload, r && r.structuredContent];
  for (const b of (r && r.content) || []) if (b && b.type === "text") c.push(b.text);
  for (let x of c) {
    if (typeof x === "string") { try { x = JSON.parse(x); } catch { continue; } }
    if (x && fits(x)) return x;
  }
  return null;
}
function tableRows(r) {
  const p = jsonOf(r, (x) => Array.isArray(x.rows) && Array.isArray(x.columns));
  if (!p) throw { code: "tool_error", message: "onverwacht antwoord van Shopify Analytics" };
  const cols = p.columns.map((c) => c.name);
  return p.rows.map((row) => (Array.isArray(row) ? Object.fromEntries(cols.map((c, i) => [c, row[i]])) : row));
}

/* ---------- Shopify ---------- */
function shopQueries() {
  const R = S.range, R2 = R * 2;
  return {
    months: "FROM sales SHOW orders, gross_sales, discounts, sales_reversals, net_sales, shipping_charges, taxes, total_sales, average_order_value TIMESERIES month SINCE -365d UNTIL today",
    days: `FROM sales SHOW orders, gross_sales, discounts, sales_reversals, net_sales, taxes, total_sales TIMESERIES day SINCE -${R2}d UNTIL today`,
    products: `FROM sales SHOW net_sales, gross_sales, orders, quantity_ordered, quantity_returned, sales_reversals GROUP BY product_title SINCE -${R}d UNTIL today ORDER BY net_sales DESC LIMIT 60`,
    sizes: `FROM sales SHOW quantity_ordered, quantity_returned GROUP BY product_variant_title SINCE -90d UNTIL today ORDER BY quantity_ordered DESC LIMIT 40`,
    weeks: "FROM sessions SHOW sessions, sessions_with_cart_additions, sessions_that_reached_checkout, sessions_that_completed_checkout, conversion_rate TIMESERIES week SINCE -120d UNTIL today",
    funnelNow: `FROM sessions SHOW sessions, sessions_with_cart_additions, sessions_that_reached_checkout, sessions_that_completed_checkout, conversion_rate SINCE -${R}d UNTIL today`,
    funnelPrev: `FROM sessions SHOW sessions, sessions_with_cart_additions, sessions_that_reached_checkout, sessions_that_completed_checkout, conversion_rate SINCE -${R2}d UNTIL -${R + 1}d`,

  const funnel = (f) => ({ s: num(f.sessions), cart: num(f.sessions_with_cart_additions), co: num(f.sessions_that_reached_checkout), done: num(f.sessions_that_completed_checkout) });
  const F = funnel(fn), FP = funnel(fp);
  for (const f of [F, FP]) { f.cvr = div(f.done, f.s); f.atc = div(f.cart, f.s); f.toCo = div(f.co, f.cart); f.coDone = div(f.done, f.co); }
  const cm = q.customers || [], lastFull = cm.slice(-2, -1)[0] || cm.slice(-1)[0] || {};
  const tracking = (q.landing || []).filter((l) => /parcelpanel|track/i.test(l.landing_page_path || "")).reduce((s, l) => s + num(l.sessions), 0);
  const stock = q.stock || [];
  const soldTitles = new Set((q.products || []).slice(0, 25).map((p) => p.product_title));
  const negBest = stock.filter((p) => soldTitles.has(p.title) && (p.variants?.nodes || []).some((v) => num(v.inventoryQuantity) < 0));
  return { T, P, F, FP, returning: num(lastFull.returning_customer_rate), tracking, negBest, stock };
}

/* ---------- Pijlers ---------- */
function statusOf(s) { return s >= 70 ? ["Goed", "good"] : s >= 45 ? ["Let op", "warn"] : ["Actie nodig", "neg"]; }
function pillars() {
  const sh = shopModel(), am = adModel(), E = econ(), out = [];
  if (sh) {
    const g = div(sh.T.total - sh.P.total, sh.P.total);
    out.push({ key: "groei", name: "Groei", score: Number.isFinite(g) ? clamp(60 + g * 150, 5, 98) : 50, value: Number.isFinite(g) ? signed(g) : "–", text: Number.isFinite(g) ? `Omzet ${eur(sh.T.total)} in ${S.range} dagen, ${g >= 0 ? "meer" : "minder"} dan de ${S.range} dagen ervoor (${eur(sh.P.total)}).` : "Nog geen vergelijkbare periode." });
    const cv = sh.F.cvr;
    out.push({ key: "conversie", name: "Conversie", score: Number.isFinite(cv) ? clamp(20 + (cv - 0.006) * 4500, 5, 98) : 50, value: pct(cv, 2), text: `${pct(sh.F.atc, 1)} legt in winkelwagen, ${pct(sh.F.toCo, 0)} daarvan gaat naar checkout, ${pct(sh.F.coDone, 0)} rekent af.` });
    const rr = sh.T.returnRate;
    out.push({ key: "retour", name: "Retouren", score: Number.isFinite(rr) ? clamp(100 - rr * 900, 5, 98) : 50, value: pct(rr, 1), text: `${eur(-sh.T.rev)} teruggeboekt op ${eur(sh.T.gross)} bruto. Retouren lopen achter op de verkoop, dus check deze week opnieuw.` });
    out.push({ key: "klanten", name: "Terugkerende klanten", score: clamp(25 + sh.returning * 400, 5, 98), value: pct(sh.returning, 1), text: `Van de klanten vorige maand kocht ${pct(sh.returning, 1)} al eerder. Voor kleding is 15 tot 25% haalbaar met e-mail en een tweede-aankoopflow.` });
    const wismo = div(sh.tracking, sh.T.orders);
    out.push({ key: "levering", name: "Levering & service", score: clamp(95 - (Number.isFinite(wismo) ? wismo * 18 : 0) - sh.negBest.length * 3, 5, 98), value: Number.isFinite(wismo) ? wismo.toLocaleString("nl-NL", { maximumFractionDigits: 1 }) + "× per order" : "–", text: `De trackingpagina werd ${int(sh.tracking)} keer als landingspagina geopend. ${sh.negBest.length} bestsellers staan onder nul voorraad (verkoop op nabestelling).` });
  }
  if (am && am.tot.spend > 0) {
    const mer = sh ? div(sh.T.total, am.tot.spend) : NaN, ratio = div(mer, E.be);
    out.unshift({ key: "winst", name: "Winst na ads", score: Number.isFinite(ratio) ? clamp(55 + (ratio - 1) * 110, 5, 98) : 50, value: "MER " + times(mer), text: `Elke euro Meta levert ${times(mer)} omzet op. Break-even ligt bij ${times(E.be)}, je doel bij ${times(E.target)}.` });
    const waste = div(sum(am.list.filter((a) => a.verdict[0] === "Stoppen"), (a) => a.spend), am.tot.spend);
    const tired = am.list.filter((a) => a.flags.some((f) => f[0] === "Hoge frequentie" || f[0] === "CTR daalt")).length;
    out.splice(1, 0, { key: "ads", name: "Ads-efficiëntie", score: clamp(95 - waste * 220 - tired * 2, 5, 98), value: pct(waste, 0) + " verspild", text: `${eur(waste * am.tot.spend)} van ${eur(am.tot.spend)} ging naar ads onder break-even. ${tired} ads tonen vermoeidheid.` });
  }
  return out;
}

/* ---------- Acties uit de data, gesorteerd op geschatte impact per maand ---------- */

    if (f.atc < 0.06 && f.s > 1000) out.push({ area: "Productpagina", title: `Meer bezoekers in de winkelwagen (nu ${pct(f.atc, 1)})`, why: "Mobiel is vrijwel al je verkeer. Zorg dat maat, prijs, levertijd en de knop zonder scrollen zichtbaar zijn, met een maattabel en reviews direct onder de knop.", impact: f.s * (0.06 - f.atc) * f.toCo * f.coDone * sh.T.aov * m * E.contrib, unit: "extra winst" });

}

/* ============================================================
   Grafieken
   ============================================================ */
function lineChart(labels, series, o = {}) {
  const W = 760, H = o.h || 220, L = 56, R = o.right ? 48 : 12, T = 10, B = 26;
  const vals = series.filter((s) => !s.right).flatMap((s) => s.values).filter(Number.isFinite);
  const max = Math.max(1, ...vals) * 1.08;
  const rv = series.filter((s) => s.right).flatMap((s) => s.values).filter(Number.isFinite);
  const rmax = rv.length ? Math.max(...rv) * 1.15 : 1;
  const x = (i) => L + (labels.length < 2 ? 0 : (i * (W - L - R)) / (labels.length - 1));
  const y = (v, r) => T + (H - T - B) * (1 - v / (r ? rmax : max));
  const ticks = 4; let g = "";
  for (let i = 0; i <= ticks; i++) { const v = (max * i) / ticks, yy = y(v); g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end" font-size="10.5" fill="var(--text-3)">${esc((o.fmt || int)(v))}</text>`; if (o.right && rv.length) { const rvv = (rmax * i) / ticks; g += `<text x="${W - R + 6}" y="${yy + 4}" font-size="10.5" fill="var(--text-3)">${esc((o.rfmt || int)(rvv))}</text>`; } }
  const step = Math.max(1, Math.ceil(labels.length / 7));
  labels.forEach((l, i) => { if (i % step === 0 || i === labels.length - 1) g += `<text x="${x(i)}" y="${H - 7}" text-anchor="middle" font-size="10.5" fill="var(--text-3)">${esc(l)}</text>`; });
  for (const s of series) {
    const pts = s.values.map((v, i) => (Number.isFinite(v) ? [x(i), y(v, s.right)] : null)).filter(Boolean);
    if (!pts.length) continue;
    if (s.area) g += `<path d="M${pts[0][0]},${y(0)} ${pts.map((p) => "L" + p.join(",")).join(" ")} L${pts[pts.length - 1][0]},${y(0)}Z" fill="${s.color}" opacity=".1"/>`;
    g += `<polyline points="${pts.map((p) => p.join(",")).join(" ")}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" ${s.dash ? 'stroke-dasharray="4 4"' : ""}/>`;
    const e = pts[pts.length - 1]; g += `<circle cx="${e[0]}" cy="${e[1]}" r="3.5" fill="${s.color}"/>`;
  }
  if (o.refLine != null && Number.isFinite(o.refLine)) { const yy = y(o.refLine, o.refRight); g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--neg)" stroke-dasharray="3 4"/><text x="${W - R - 4}" y="${yy - 5}" text-anchor="end" font-size="10.5" fill="var(--neg)">${esc(o.refLabel || "")}</text>`; }
  const id = "c" + Math.random().toString(36).slice(2, 8);
  CHARTS[id] = { labels, series, x, W, L, R, fmt: o.fmt, rfmt: o.rfmt };
  return `<div class="chartlegend">${series.map((s) => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div><div class="chart" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || "grafiek")}">${g}<line class="hair" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--text-3)" stroke-width="1" opacity="0"/></svg><div class="tip" hidden></div></div>`;
}
const CHARTS = {};
document.addEventListener("pointermove", (ev) => {
  const el = ev.target.closest && ev.target.closest(".chart"); document.querySelectorAll(".chart .tip").forEach((t) => { if (!el || !el.contains(t)) t.hidden = true; });
  if (!el) return; const c = CHARTS[el.dataset.chart]; if (!c) return;
  const svg = el.querySelector("svg"), r = svg.getBoundingClientRect(), sx = ((ev.clientX - r.left) / r.width) * c.W;
  let best = 0, bd = Infinity; c.labels.forEach((_, i) => { const d = Math.abs(c.x(i) - sx); if (d < bd) { bd = d; best = i; } });
  const hair = svg.querySelector(".hair"); hair.setAttribute("x1", c.x(best)); hair.setAttribute("x2", c.x(best)); hair.setAttribute("opacity", ".35");
  const tip = el.querySelector(".tip"); tip.hidden = false;
  tip.innerHTML = `<b>${esc(c.labels[best])}</b>` + c.series.map((s) => `<div><span>${esc(s.name)}</span><span class="num">${esc((s.right ? c.rfmt || int : c.fmt || int)(s.values[best]))}</span></div>`).join("");
  const px = (c.x(best) / c.W) * r.width; tip.style.left = Math.min(Math.max(0, px + 12), r.width - 170) + "px";
});
function hbars(items, o = {}) {
  const max = Math.max(1e-9, ...items.map((i) => Math.abs(i.v)));
  return `<div class="bars">${items.map((i) => `<div class="bar"><span class="t" title="${esc(i.t)}">${esc(i.t)}</span><span class="track"><i style="width:${(Math.abs(i.v) / max) * 100}%;background:${i.c || o.color || "var(--s1)"}"></i></span><span class="v">${esc(i.label != null ? i.label : (o.fmt || eur)(i.v))}</span></div>`).join("")}</div>`;
}
function ring(score) {
  const st = statusOf(score), r = 54, c = 2 * Math.PI * r, col = `var(--${st[1]})`;
  return `<svg class="ring" viewBox="0 0 132 132" role="img" aria-label="Totaalscore ${Math.round(score)} van 100"><circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="12"/><circle cx="66" cy="66" r="${r}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(score / 100) * c} ${c}" transform="rotate(-90 66 66)"/><text x="66" y="72" text-anchor="middle" font-size="30" font-weight="600" fill="var(--text)" font-family="Inter,system-ui,sans-serif">${Math.round(score)}</text><text x="66" y="92" text-anchor="middle" font-size="11" fill="var(--text-3)" font-family="Inter,system-ui,sans-serif">van 100</text></svg>`;
}
const pill = (t, c) => `<span class="pill ${c}">${esc(t)}</span>`;
const kpi = (l, v, s, cls = "") => `<div class="card kpi"><div class="l">${esc(l)}</div><div class="v ${cls}">${v}</div>${s ? `<div class="s">${s}</div>` : ""}</div>`;
const delta = (a, b, inverse) => { const d = div(a - b, Math.abs(b)); if (!Number.isFinite(d)) return ""; const good = inverse ? d < 0 : d > 0; return `<span class="${Math.abs(d) < 0.02 ? "muted" : good ? "good" : "neg"}">${signed(d, (n) => pct(n, 0))}</span> t.o.v. vorige ${S.range} dagen`; };

/* ---------- Brand check ---------- */
function viewCheck() {
  const sh = shopModel(), am = adModel(), E = econ(), P = pillars();
  if (!sh && !am) return S.shop.status === "fout" && S.meta.status === "fout" ? shopWait() + metaWait() : waiting("Cijfers laden uit Shopify en Meta…");
  const total = P.length ? sum(P, (p) => p.score) / P.length : 50;
  const worst = [...P].sort((a, b) => a.score - b.score).slice(0, 2).map((p) => p.name.toLowerCase());
  const mer = sh && am ? div(sh.T.total, am.tot.spend) : NaN;
  const profitEst = sh && am ? sh.T.total * E.contrib - am.tot.spend : NaN;
  const sug = suggestions();

    h += `<section class="grid kpis">

      ${kpi("Orders", int(sh.T.orders), delta(sh.T.orders, sh.P.orders))}
      ${kpi("Gem. orderwaarde", eur(sh.T.aov), delta(sh.T.aov, sh.P.aov))}

      ${am ? kpi("Meta ROAS (pixel)", times(am.tot.roas), `CPA ${eur(am.tot.cpa)}, break-even ${eur(E.beCpa)}`, am.tot.roas >= E.be ? "" : "neg") : ""}
      ${kpi("Conversie", pct(sh.F.cvr, 2), delta(sh.F.cvr, sh.FP.cvr))}
      ${kpi("Retouren", pct(sh.T.returnRate, 1), delta(sh.T.returnRate, sh.P.returnRate, true))}
    </section>`;
  }
  h += `<section class="grid pillars">${P.map((p) => { const st = statusOf(p.score); return `<div class="card pillar"><div class="top"><h3>${esc(p.name)}</h3>${pill(st[0], st[1])}</div><div class="row between"><div class="score">${Math.round(p.score)}<small>/100</small></div><div class="num dim">${esc(p.value)}</div></div><div class="meter"><i style="width:${p.score}%;background:var(--${st[1]})"></i></div><p>${esc(p.text)}</p></div>`; }).join("")}</section>`;
  h += `<section class="card"><div class="row between"><div><h2>Wat nu, op volgorde van impact</h2><p class="lead">Berekend uit je eigen cijfers. Impact is per maand, een schatting. Zet wat je gaat doen op je actielijst.</p></div><button class="btn ghost small" type="button" data-ask="Maak voor deze week een concreet plan van maximaal 5 acties om winstgevender te worden, op volgorde van impact. Per actie: wat ik precies aanpas, in welk scherm, en welk getal ik verwacht te zien bewegen.">Laat Claude een weekplan maken</button></div>
    ${sug.length ? sug.map((s, i) => `<div class="act"><span class="area">${esc(s.area)}</span><div><b>${esc(s.title)}</b><p>${esc(s.why)}</p><div class="row" style="margin-top:6px"><button class="btn ghost small" type="button" data-addaction="${i}">Op actielijst</button><button class="btn ghost small" type="button" data-ask="${esc(`Help me met deze actie: ${s.title}. Context: ${s.why} Geef concrete stappen, en waar het om teksten gaat, schrijf ze voor me uit.`)}">Hulp van Claude</button></div></div><div class="imp">${Number.isFinite(s.impact) && s.impact > 0 ? "~" + eur(s.impact) : "–"}<small>${esc(s.unit || "")}</small></div></div>`).join("") : `<p class="muted">Nog geen suggesties: de cijfers laden of alles staat goed.</p>`}</section>`;
  if (sh) {
    const days = (S.shop.q.days || []).slice(-S.range);
    const md = am ? am.byDay : new Map();
    const labels = days.map((d) => String(d.day).slice(5).split("-").reverse().join("-"));
    h += `<section class="card"><h2>Omzet en Meta per dag</h2><p class="lead">Omzet incl. btw uit Shopify, spend uit Meta, MER op de rechteras.</p>${lineChart(labels, [
      { name: "Omzet", color: "var(--s1)", values: days.map((d) => num(d.total_sales)), area: true },
      ...(am ? [{ name: "Meta spend", color: "var(--s2)", values: days.map((d) => (md.get(String(d.day).slice(0, 10)) || {}).spend || 0) }, { name: "MER", color: "var(--s3)", right: true, dash: true, values: days.map((d) => { const s = (md.get(String(d.day).slice(0, 10)) || {}).spend; return s ? num(d.total_sales) / s : NaN; }) }] : []),
    ], { fmt: eur, right: !!am, rfmt: times, refLine: am ? E.be : null, refRight: true, refLabel: `break-even ${times(E.be)}`, label: "Omzet en spend per dag" })}</section>`;
    const months = S.shop.q.months || [];
    h += `<section class="card"><h2>Omzet per maand</h2>${lineChart(months.map((m) => new Date(String(m.month) + "T12:00:00").toLocaleDateString("nl-NL", { month: "short", year: "2-digit" })), [{ name: "Omzet incl. btw", color: "var(--s1)", values: months.map((m) => num(m.total_sales)), area: true }, { name: "Gem. orderwaarde", color: "var(--s4)", right: true, values: months.map((m) => num(m.average_order_value)) }], { fmt: eur, right: true, rfmt: eur, h: 200, label: "Omzet per maand" })}</section>`;
  }
  return h;
}

/* ---------- Ads ---------- */
function sortList(list, tab, def) {
  const s = S.sort[tab] || def; const dir = s.dir === "asc" ? 1 : -1;
  return [...list].sort((a, b) => { const x = a[s.key], y = b[s.key]; if (typeof x === "string") return dir * String(x).localeCompare(String(y)); return dir * ((Number.isFinite(x) ? x : -Infinity) - (Number.isFinite(y) ? y : -Infinity)); });
}
const th = (tab, key, label, r = true) => `<th class="${r ? "r" : ""}" data-sort="${tab}:${key}">${esc(label)}${(S.sort[tab] || {}).key === key ? ((S.sort[tab].dir === "asc") ? " ↑" : " ↓") : ""}</th>`;
const rcls = (v, E) => (!Number.isFinite(v) ? "" : v >= E.target ? "good" : v >= E.be ? "" : "neg");
const roasTd = (g, E) => `<td class="r ${rcls(g.roas, E)}">${g.spend ? times(g.roas) : "–"}</td>`;
const stPill = (s) => { const x = STATUS[s]; return x ? pill(x[0], x[1]) : s ? pill(s.toLowerCase(), "mute") : ""; };
const metaRow = (g, E, opts = {}) => `<td class="r">${eur(g.spend)}</td>${roasTd(g, E)}<td class="r">${g.pur ? eur(g.cpa) : "–"}</td><td class="r">${int(g.pur)}</td><td class="r">${pct(g.ctr, 2)}</td><td class="r">${eur2(g.cpm)}</td>${opts.atc === false ? "" : `<td class="r">${pct(g.atcRate, 1)}</td>`}<td class="r ${g.profit >= 0 ? "good" : "neg"}">${eur(g.profit)}</td>`;
const metaHead = (first, opts = {}) => `<tr><th>${esc(first)}</th><th class="r">Spend</th><th class="r">ROAS</th><th class="r">CPA</th><th class="r">Aank.</th><th class="r">CTR</th><th class="r">CPM</th>${opts.atc === false ? "" : '<th class="r">In wagen/klik</th>'}<th class="r">Winst*</th></tr>`;
const winstNote = (E) => `<p class="note" style="margin-top:8px">*Winst = Meta-omzet × ${pct(E.contrib, 0)} (wat van elke euro overblijft na btw, retouren, inkoop, betaalkosten en verzending) min spend. Groen = boven doel-ROAS ${times(E.target)}, rood = onder break-even ${times(E.be)}.</p>`;

function adInsights(am) {
  const E = am.E, q = S.meta.q, out = [];
  const camps = am.camps.filter((c) => c.spend > E.beCpa);
  if (camps.length > 1) { const b = [...camps].sort((x, y) => y.roas - x.roas); out.push(["Beste campagne", `${b[0].key}: ${times(b[0].roas)} ROAS op ${eur(b[0].spend)}. Slechtste: ${b[b.length - 1].key} met ${times(b[b.length - 1].roas)}.`, "info"]); }
  const below = am.list.filter((a) => a.roas < E.be && a.spend >= E.beCpa);
  if (below.length) out.push(["Spend onder break-even", `${eur(sum(below, (a) => a.spend))} (${pct(div(sum(below, (a) => a.spend), am.tot.spend), 0)}) ging naar ${below.length} ads onder ${times(E.be)} ROAS.`, "neg"]);
  const demo = groupRows(q.demo, (r) => r.gender, E);
  const f = demo.find((x) => x.key === "female"), m = demo.find((x) => x.key === "male");
  if (f && m && f.spend > 100) out.push(["Vrouwen in je doelgroep", `${eur(f.spend)} spend (${pct(div(f.spend, f.spend + m.spend), 0)}) op vrouwen met ${times(f.roas)} ROAS, tegen ${times(m.roas)} bij mannen.${f.roas < m.roas * 0.85 ? " Overweeg mannen-only voor koude doelgroepen; vrouwen kopen soms als cadeau, dus test dat eerst rond feestdagen." : ""}`, f.roas < E.be ? "warn" : "info"]);
  const ages = groupRows((q.demo || []).filter((r) => r.age && r.age !== "Unknown"), (r) => r.age, E).filter((x) => x.spend > E.beCpa);
  if (ages.length > 2) { const b = [...ages].sort((x, y) => y.roas - x.roas); out.push(["Leeftijd", `Beste ROAS bij ${b[0].key} (${times(b[0].roas)}), zwakste bij ${b[b.length - 1].key} (${times(b[b.length - 1].roas)}). De meeste spend gaat naar ${ages[0].key} (${pct(div(ages[0].spend, am.tot.spend), 0)}).`, "info"]); }
  const cs = groupRows(q.country, (r) => r.country, E).filter((x) => x.spend > E.beCpa * 2);
  const badC = cs.filter((x) => x.roas < E.be);
  if (badC.length) out.push(["Landen onder break-even", badC.map((x) => `${x.key} ${times(x.roas)} (${eur(x.spend)})`).join(", ") + ".", "warn"]);
  const goodC = cs.filter((x) => x.roas >= E.target && x.spend < am.tot.spend * 0.05);
  if (goodC.length) out.push(["Landen met ruimte om te groeien", goodC.map((x) => `${x.key} ${times(x.roas)} op maar ${eur(x.spend)}`).join(", ") + ".", "good"]);
  const pl = groupRows(q.place, placeName, E).filter((x) => x.spend > 100 && x.roas < E.be);
  if (pl.length) out.push(["Plaatsingen onder break-even", pl.map((x) => `${x.key} ${times(x.roas)} (${eur(x.spend)})`).join(", ") + ".", "warn"]);
  const fresh = am.list.filter((a) => a.ageDays <= 7 && a.status === "ACTIVE").length, active = am.list.filter((a) => a.status === "ACTIVE").length;
  out.push(["Creatieve aanvoer", `${active} actieve ads met spend, waarvan ${fresh} in de laatste 7 dagen gelanceerd.${fresh < 3 ? " Lever elke week 3 tot 5 nieuwe creatives aan, anders raken je winnaars moe." : ""}`, fresh < 3 ? "warn" : "info"]);
  const dis = am.list.filter((a) => a.status === "DISAPPROVED");
  if (dis.length) out.push(["Afgekeurde ads", `${dis.length} ads zijn afgekeurd door Meta: ${dis.slice(0, 3).map((a) => a.ad).join(", ")}. Check in Ads Manager waarom; herhaalde afkeuring schaadt je account.`, "neg"]);
  return out;
}

    ], { fmt: eur, right: true, rfmt: times, refLine: E.be, refRight: true, refLabel: `break-even ${times(E.be)}`, label: "Spend en ROAS per dag" })}</section>
    <div class="grid two"><section class="card"><h2>Kosten per aankoop (7 d)</h2>${lineChart(lbl, [{ name: "CPA", color: "var(--s1)", values: days.map((_, i) => roll(i, (w) => div(sum(w, (x) => x.spend), sum(w, (x) => x.pur)))) }], { fmt: eur, h: 190, refLine: E.beCpa, refLabel: `break-even ${eur(E.beCpa)}`, label: "CPA per dag" })}</section>
    <section class="card"><h2>CTR en CPM (7 d)</h2>${lineChart(lbl, [{ name: "CPM", color: "var(--s4)", values: days.map((_, i) => roll(i, (w) => div(sum(w, (x) => x.spend) * 1000, sum(w, (x) => x.impr)))) }, { name: "CTR (link)", color: "var(--s6)", right: true, values: days.map((_, i) => roll(i, (w) => div(sum(w, (x) => x.link), sum(w, (x) => x.impr)))) }], { fmt: eur2, right: true, rfmt: (v) => pct(v, 2), h: 190, label: "CTR en CPM per dag" })}</section></div>`;

    <tr><td><b>Totaal actief budget</b></td><td></td><td class="r"><b>${eur(sum(am.camps.filter((c) => c.status === "ACTIVE"), (c) => c.budget || 0))}</b></td><td colspan="9"></td></tr>

  <details style="margin-top:12px"><summary>Advertentiesets (${am.adsets.length})</summary><div class="scroll" style="margin-top:8px"><table><thead><tr><th>Set</th><th>Status</th><th class="r">Budget/dag</th><th class="r">Spend</th><th class="r">ROAS</th><th class="r">CPA</th><th class="r">Aank.</th><th class="r">CTR</th><th class="r">CPM</th><th class="r">Freq.</th></tr></thead><tbody>${am.adsets.map((s) => `<tr><td class="name"><b>${esc(s.adset)}</b><small>${esc(s.campaign)}</small></td><td>${stPill(s.status)}</td><td class="r">${s.budget ? eur(s.budget) : "–"}</td><td class="r">${eur(s.spend)}</td>${roasTd(s, E)}<td class="r">${s.pur ? eur(s.cpa) : "–"}</td><td class="r">${int(s.pur)}</td><td class="r">${pct(s.ctr, 2)}</td><td class="r">${eur2(s.cpm)}</td><td class="r">${Number.isFinite(s.freq) ? s.freq.toFixed(2) : "–"}</td></tr>`).join("")}</tbody></table></div></details></section>`;

  h += `<div class="grid two"><section class="card"><h2>Per markt</h2><p class="lead">Uit de campagnenaam.</p><div class="scroll"><table><thead>${metaHead("Markt", { atc: false })}</thead><tbody>${mk.map((g) => `<tr><td>${esc(g.key)}</td>${metaRow(g, E, { atc: false })}</tr>`).join("")}</tbody></table></div></section>
  <section class="card"><h2>Per campagnetype</h2><p class="lead">Testen, schalen, lookalike, retargeting.</p><div class="scroll"><table><thead>${metaHead("Type", { atc: false })}</thead><tbody>${ty.map((g) => `<tr><td>${esc(g.key)}</td>${metaRow(g, E, { atc: false })}</tr>`).join("")}</tbody></table></div></section></div>`;
  return h;
}

function viewAdList() {
  const am = adModel(); if (!am) return metaWait();
  const E = am.E, f = S.adFilter;
  let list = am.list.filter((a) => (f.status !== "active" || a.status === "ACTIVE") && (!f.q || `${a.ad} ${a.adset} ${a.campaign} ${a.angle} ${a.body} ${a.title}`.toLowerCase().includes(f.q.toLowerCase())) && (!f.verdict || a.verdict[0] === f.verdict) && (!f.market || a.market === f.market) && (!f.type || a.type === f.type));
  list = sortList(list, "ads", { key: "spend", dir: "desc" });
  const total = list.length; if (!S.adShowAll) list = list.slice(0, 40);
  const base = am.list.filter((a) => f.status !== "active" || a.status === "ACTIVE");
  const counts = {}; for (const a of base) counts[a.verdict[0]] = (counts[a.verdict[0]] || 0) + 1;
  const vSpend = (v) => sum(base.filter((a) => a.verdict[0] === v), (a) => a.spend);
  const opt = (arr, cur) => arr.map((x) => `<option ${x === cur ? "selected" : ""}>${esc(x)}</option>`).join("");

  <section class="card"><h2>Waar de ads naartoe sturen</h2><p class="lead">Landingspagina van de ad, met de prestaties in Meta en hoe die pagina in Shopify converteert.</p><div class="scroll"><table><thead><tr><th>Pagina</th><th class="r">Ads</th><th class="r">Spend</th><th class="r">ROAS</th><th class="r">CPA</th><th class="r">In wagen/klik</th><th class="r">Shopify-conversie</th></tr></thead><tbody>${dests.map((g) => { const l = lp.get(g.key.replace(/ \(met code\)$/, "")); return `<tr><td style="overflow-wrap:anywhere">${esc(g.key)}</td><td class="r">${g.n}</td><td class="r">${eur(g.spend)}</td>${roasTd(g, E)}<td class="r">${g.pur ? eur(g.cpa) : "–"}</td><td class="r ${g.atcRate < 0.05 && g.link > 300 ? "neg" : ""}">${pct(g.atcRate, 1)}</td><td class="r">${l ? pct(num(l.conversion_rate), 2) : "–"}</td></tr>`; }).join("")}</tbody></table></div></section>`;

  const pl = groupRows(q.place, placeName, E);

/* ---------- Producten ---------- */
function viewProducts() {
  const sh = shopModel(); if (!sh) return shopWait();
  const q = S.shop.q, st = S.settings;
  const stockBy = new Map((q.stock || []).map((p) => [p.title, p]));
  const land = new Map(); for (const l of q.landing || []) { const m = /\/products\/([^/?#]+)/.exec(l.landing_page_path || ""); if (!m) continue; const h = m[1].replace(/-\d+$/, ""); const x = land.get(h) || { s: 0, cart: 0, done: 0 }; x.s += num(l.sessions); x.cart += num(l.sessions_with_cart_additions); x.done += num(l.sessions_that_completed_checkout); land.set(h, x); }
  const rows = (q.products || []).filter((p) => p.product_title).map((p) => {
    const s = stockBy.get(p.product_title), handle = s ? s.handle : "", L = land.get(handle) || land.get(handle.replace(/-\d+$/, ""));
    const units = num(p.quantity_ordered), ret = -num(p.quantity_returned), cogsPct = st.cogsByProduct[p.product_title] != null ? st.cogsByProduct[p.product_title] : st.cogsPct;
    const net = num(p.net_sales);
    const neg = s ? (s.variants?.nodes || []).filter((v) => num(v.inventoryQuantity) < 0).map((v) => v.title) : [];
    return { title: p.product_title, net, orders: num(p.orders), units, ret, retRate: div(ret, units), revRate: div(-num(p.sales_reversals), num(p.gross_sales)), price: s ? num(s.priceRangeV2?.minVariantPrice?.amount) : NaN, compare: s ? num(s.compareAtPriceRange?.maxVariantCompareAtPrice?.amount) : NaN, stock: s ? s.totalInventory : null, neg, cogsPct, margin: net * (1 - cogsPct / 100), lpS: L ? L.s : 0, lpAtc: L ? div(L.cart, L.s) : NaN, lpCvr: L ? div(L.done, L.s) : NaN };
  });
  const list = sortList(rows, "products", { key: "net", dir: "desc" });
  const totNet = sum(rows, (r) => r.net);
  const top3 = sum(rows.slice().sort((a, b) => b.net - a.net).slice(0, 3), (r) => r.net);
  let h = `<section class="grid kpis">${kpi("Netto omzet producten", eur(totNet), `${S.range} dagen`)}${kpi("Top 3 aandeel", pct(div(top3, totNet), 0), "afhankelijkheid van een paar bestsellers")}${kpi("Producten met verkoop", int(rows.filter((r) => r.net > 0).length), "")}${kpi("Bestsellers onder nul", int(sh.negBest.length), "verkoop op nabestelling", sh.negBest.length ? "warn" : "")}</section>
  <section class="card"><h2>Bestsellers</h2>${hbars(rows.slice().sort((a, b) => b.net - a.net).slice(0, 12).map((r) => ({ t: r.title.replace(/^MILANO /, ""), v: r.net })))}</section>
  <section class="card"><h2>Alle producten</h2><p class="lead">Retour % = teruggestuurde stuks / verkochte stuks. Productpagina = sessies die op die pagina binnenkwamen (vooral ads). Marge = netto omzet min inkoop (${st.cogsPct}% standaard, per product aan te passen bij Instellingen).</p><div class="scroll"><table><thead><tr>${th("products", "title", "Product", false)}${th("products", "net", "Netto")}${th("products", "units", "Stuks")}${th("products", "retRate", "Retour %")}${th("products", "price", "Prijs")}${th("products", "margin", "Marge")}${th("products", "lpS", "Pagina-sessies")}${th("products", "lpAtc", "In wagen")}${th("products", "lpCvr", "Conversie")}${th("products", "stock", "Voorraad")}</tr></thead><tbody>
  ${list.map((r) => `<tr><td class="name"><b>${esc(r.title)}</b>${r.neg.length ? `<span class="badge warn">onder nul: ${esc(r.neg.slice(0, 4).join(", "))}${r.neg.length > 4 ? "…" : ""}</span>` : ""}${r.retRate > 0.06 && r.units >= 10 ? `<span class="badge neg">veel retour</span>` : ""}${r.lpS > 300 && r.lpAtc < 0.04 ? `<span class="badge neg">pagina converteert slecht</span>` : ""}</td><td class="r">${eur(r.net)}</td><td class="r">${int(r.units)}</td><td class="r ${r.retRate > 0.06 ? "neg" : ""}">${r.units ? pct(r.retRate, 1) : "–"}</td><td class="r">${eur(r.price)}${r.compare > r.price ? `<small class="note" style="display:block"><s>${eur(r.compare)}</s></small>` : ""}</td><td class="r">${eur(r.margin)}</td><td class="r">${r.lpS ? int(r.lpS) : "–"}</td><td class="r">${pct(r.lpAtc, 1)}</td><td class="r">${pct(r.lpCvr, 2)}</td><td class="r ${r.stock < 0 ? "warn" : ""}">${r.stock == null ? "–" : int(r.stock)}</td></tr>`).join("")}
  </tbody></table></div></section>`;
  const sizes = (q.sizes || []).filter((s) => s.product_variant_title && !s.product_variant_title.includes("/"));
  if (sizes.length) h += `<section class="card"><h2>Retour per maat (90 dagen)</h2><p class="lead">Als één maat veel vaker terugkomt, klopt je maattabel niet. Zet een maatadvies op de pagina.</p>${hbars(sizes.map((s) => ({ t: s.product_variant_title, v: div(-num(s.quantity_returned), num(s.quantity_ordered)), label: `${pct(div(-num(s.quantity_returned), num(s.quantity_ordered)), 1)} van ${int(num(s.quantity_ordered))}`, c: "var(--s2)" })), { fmt: (v) => pct(v, 1) })}</section>`;
  return h;
}

/* ---------- Funnel ---------- */
function viewFunnel() {
  const sh = shopModel(); if (!sh) return shopWait();

function mdLite(t) {
  const lines = esc(t).split("\n"); let h = "", list = null;
  const inline = (s) => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*(?!\s)(.+?)\*/g, "$1<i>$2</i>");
  for (const l of lines) {
    const m = /^\s*(?:[-*•]|\d+[.)])\s+(.*)$/.exec(l);
    if (m) { const tag = /^\s*\d/.test(l) ? "ol" : "ul"; if (list !== tag) { if (list) h += `</${list}>`; h += `<${tag}>`; list = tag; } h += `<li>${inline(m[1])}</li>`; continue; }
    if (list) { h += `</${list}>`; list = null; }
    const hd = /^#{1,4}\s+(.*)$/.exec(l);
    if (hd) h += `<h4>${inline(hd[1])}</h4>`; else if (l.trim()) h += `<p>${inline(l)}</p>`;
  }
  if (list) h += `</${list}>`;
  return h;
}

      const clean = {}; for (const [k, v] of Object.entries(res)) if (typeof v === "string" && v.length < 40 && items.some((i) => i.key === k)) clean[k] = v;
      S.angles = { ...S.angles, ...clean };
      if (S.db) await S.db.doc("labels/angles").set({ map: S.angles, updatedAt: Date.now() }).catch(() => toast("Opslaan van angles mislukt."));
      toast(`${Object.keys(clean).length} ads ingedeeld.`);
    }
  } catch (e) { toast(e && e.code === "not_granted" ? "Claude heeft geen toestemming op deze pagina." : "Indelen mislukt: " + ((e && e.message) || "onbekende fout")); }
  S.angleBusy = false; render();
}

/* ---------- Instellingen ---------- */
function viewSettings() {
  const st = S.settings, E = econ(), prods = (S.shop.q.products || []).slice(0, 30).map((p) => p.product_title).filter(Boolean);
  return `<section class="card"><h2>Kosten en doelen</h2><p class="lead">Hiermee rekent het dashboard break-even en winst uit. Btw-aandeel (${pct(E.taxShare, 1)}), retour-aandeel (${pct(E.returnShare, 1)}) en orderwaarde (${eur(E.aov)}) komen live uit Shopify. Shopify heeft geen inkoopprijzen, dus vul je inkoop hier in.</p>
  <form id="setForm" class="formgrid">
    <label for="cogsPct">Inkoop als % van netto omzet<input class="input num" id="cogsPct" type="number" min="0" max="95" step="1" value="${st.cogsPct}"></label>
    <label for="shipPerOrder">Verzendkosten per order (€)<input class="input num" id="shipPerOrder" type="number" min="0" step="0.5" value="${st.shipPerOrder}"></label>
    <label for="feePct">Betaalkosten (% van omzet)<input class="input num" id="feePct" type="number" min="0" max="15" step="0.1" value="${st.feePct}"></label>
    <label for="targetProfitPct">Gewenste winst (% van omzet)<input class="input num" id="targetProfitPct" type="number" min="0" max="60" step="1" value="${st.targetProfitPct}"></label>
    <label for="minSpendFactor">Oordeel pas na × break-even CPA spend<input class="input num" id="minSpendFactor" type="number" min="0.5" max="5" step="0.5" value="${st.minSpendFactor}"></label>
    <div style="display:flex;align-items:flex-end"><button class="btn" type="submit">Opslaan</button></div>
  </form>
  <p class="sub">Uitkomst: van elke euro omzet blijft ${pct(E.contrib, 0)} over voor ads en winst. Break-even ROAS ${times(E.be)}, doel-ROAS ${times(E.target)}, break-even CPA ${eur(E.beCpa)}.</p></section>
  <section class="card"><h2>Inkoop per product</h2><p class="lead">Optioneel. Leeg laten = het percentage hierboven.</p><form id="cogsForm" class="formgrid">${prods.map((p, i) => `<label for="cp-${i}">${esc(p)}<input class="input num" id="cp-${i}" data-prod="${esc(p)}" type="number" min="0" max="95" step="1" placeholder="${st.cogsPct}" value="${st.cogsByProduct[p] != null ? st.cogsByProduct[p] : ""}"></label>`).join("") || `<p class="muted">Producten laden…</p>`}<div style="display:flex;align-items:flex-end"><button class="btn" type="submit">Opslaan</button></div></form></section>
  <section class="card"><h2>Bronnen</h2><p class="lead" style="margin:0">Shopify: omzet, orders, retouren, sessies en funnel (ShopifyQL), voorraad (Admin API). Meta via Windsor.ai: per ad, per campagne en set (met budget en status), teksten en headlines, dagcijfers (90 dagen), leeftijd en geslacht, landen en plaatsingen. PayPal: open disputes. Alles wordt opgehaald met de koppelingen van wie de pagina opent; er staan geen sleutels in deze pagina.</p></section>`;
}

/* ============================================================
   Opslag (db)
   ============================================================ */
async function saveSettings(patch) {
  S.settings = { ...S.settings, ...patch }; render();
  if (!S.db) { toast("Opslaan werkt alleen in claude.ai; de instelling geldt nu tijdelijk."); return; }
  try { await S.db.doc("instellingen/main").set(S.settings); toast("Opgeslagen."); } catch (e) { toast("Opslaan mislukt: " + ((e && e.message) || e.code)); }
}
async function addAction(a) {
  if (!S.db) { toast("De actielijst werkt alleen als je deze pagina in claude.ai opent."); return; }
  try { await S.db.collection("acties").add({ title: String(a.title).slice(0, 200), why: String(a.why || "").slice(0, 1000), area: String(a.area || "").slice(0, 40), impact: Number.isFinite(a.impact) ? Math.round(a.impact) : null, done: false, createdAt: Date.now() }); toast("Op de actielijst gezet."); }
  catch (e) { toast("Toevoegen mislukt: " + ((e && e.message) || e.code)); }
}
async function initDb() {
  const db = await window.claude?.use?.("db").catch(() => null);
  if (!db) return; S.db = db;
  db.doc("instellingen/main").onSnapshot((s) => { if (s.exists) { S.settings = { ...DEFAULTS, ...s.data() }; render(); } }, () => {});
  db.doc("labels/angles").onSnapshot((s) => { if (s.exists) { S.angles = (s.data() || {}).map || {}; render(); } }, () => {});
  db.collection("acties").onSnapshot((snap) => { S.actions = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)); render(); }, () => {});
}

/* ============================================================
   Gebeurtenissen
   ============================================================ */
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("button, th[data-sort]"); if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; try { localStorage.setItem("bc.tab", S.tab); } catch {} render(); window.scrollTo({ top: 0 }); return; }
  if (t.dataset.range) { S.range = Number(t.dataset.range); try { localStorage.setItem("bc.range", S.range); } catch {} loadShop(false); loadMeta(false); render(); return; }
  if (t.id === "refresh") { loadAll(true); return; }
  if (t.dataset.sort) { const [tab, key] = t.dataset.sort.split(":"); const cur = S.sort[tab]; S.sort[tab] = { key, dir: cur && cur.key === key && cur.dir === "desc" ? "asc" : "desc" }; render(); return; }
  if (t.dataset.verdict != null) { S.adFilter.verdict = S.adFilter.verdict === t.dataset.verdict ? "" : t.dataset.verdict; render(); return; }
  if (t.dataset.ask) { ask(t.dataset.ask); return; }
  if (t.dataset.addaction != null) { const s = suggestions()[Number(t.dataset.addaction)]; if (s) addAction(s); return; }
  if (t.dataset.deltodo) { S.db && S.db.doc("acties/" + t.dataset.deltodo).delete().catch(() => toast("Verwijderen mislukt.")); return; }
  if (t.id === "angleAI") { classifyAngles(); return; }
  if (t.id === "adShowAll") { S.adShowAll = true; render(); return; }
  if (t.id === "chatClear") { S.chat = []; render(); return; }
});
document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.dataset.todo) { S.db && S.db.doc("acties/" + t.dataset.todo).update({ done: t.checked, doneAt: t.checked ? Date.now() : null }).catch(() => toast("Opslaan mislukt.")); return; }
  if (t.id === "admarket") { S.adFilter.market = t.value; render(); return; }
  if (t.id === "adstatus") { S.adFilter.status = t.value; render(); return; }
  if (t.id === "adtype") { S.adFilter.type = t.value; render(); return; }
  if (t.dataset.anglekey) {
    const v = t.value.trim(); const next = { ...S.angles }; if (v) next[t.dataset.anglekey] = v; else delete next[t.dataset.anglekey];
    S.angles = next; render();
    if (S.db) S.db.doc("labels/angles").set({ map: next, updatedAt: Date.now() }).catch(() => toast("Opslaan mislukt.")); else toast("Bewaren werkt alleen in claude.ai.");
  }
});
let qT;
document.addEventListener("input", (ev) => { if (ev.target.id === "adq") { clearTimeout(qT); const v = ev.target.value; qT = setTimeout(() => { S.adFilter.q = v; render(); const el = $("adq"); if (el) { el.focus(); el.setSelectionRange(v.length, v.length); } }, 250); } });
document.addEventListener("submit", (ev) => {
  ev.preventDefault(); const f = ev.target;
  if (f.id === "chatForm") { const v = $("chatInput").value; $("chatInput").value = ""; ask(v); }
  if (f.id === "todoForm") { const v = $("todoTitle").value.trim(); if (v) addAction({ title: v, area: "Eigen" }); }
  if (f.id === "setForm") { const p = {}; for (const k of ["cogsPct", "shipPerOrder", "feePct", "targetProfitPct", "minSpendFactor"]) { const n = Number($(k).value); if (Number.isFinite(n)) p[k] = n; } saveSettings(p); }
  if (f.id === "cogsForm") { const m = {}; f.querySelectorAll("input[data-prod]").forEach((i) => { if (i.value !== "" && Number.isFinite(Number(i.value))) m[i.dataset.prod] = Number(i.value); }); saveSettings({ cogsByProduct: { ...S.settings.cogsByProduct, ...m } }); }
});
document.addEventListener("keydown", (ev) => { if (ev.target.id === "chatInput" && ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); $("chatForm").requestSubmit(); } });

/* ============================================================
   Start
   ============================================================ */
render();
(async () => {
  const use = (n) => (window.claude && window.claude.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
  initDb();
  use("sample").then((s) => { S.sample = s; if (S.tab === "advice" || S.tab === "angles") render(); });
  S.mcp = await use("mcp");
  if (!S.mcp) { S.shop.status = S.meta.status = S.pp.status = "fout"; S.shop.err = S.meta.err = S.pp.err = "Koppelingen werken alleen als je deze pagina in claude.ai opent."; render(); return; }
  loadAll(false);
})();
</script>
