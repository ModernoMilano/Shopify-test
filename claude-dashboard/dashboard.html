<style>
:root{
  --brand:#e3e0d7;--bg:#f4f2ec;--surface:#fcfcfb;--surface-2:#efece4;--line:#e3e0d7;
  --text:#121210;--text-2:#52514e;--text-3:#7a7974;--accent:#121210;--accent-text:#fff;
  --grid:#e7e4dc;--neg:#c53030;--good:#1f7a1f;--warn:#9a5a00;--info:#2a78d6;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#111110;--surface:#1a1a19;--surface-2:#242421;--line:#33322e;--text:#f5f3ee;--text-2:#c3c2b7;--text-3:#8f8e86;
  --accent:#e3e0d7;--accent-text:#111110;--grid:#2c2b28;--neg:#ef6b6b;--good:#4cbf4c;--warn:#e0a030;--info:#3987e5;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#111110;--surface:#1a1a19;--surface-2:#242421;--line:#33322e;--text:#f5f3ee;--text-2:#c3c2b7;--text-3:#8f8e86;
  --accent:#e3e0d7;--accent-text:#111110;--grid:#2c2b28;--neg:#ef6b6b;--good:#4cbf4c;--warn:#e0a030;--info:#3987e5;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:0 48px;-webkit-font-smoothing:antialiased}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line);margin-bottom:18px}

<script>
"use strict";
/* ============================================================
   Hulpfuncties: datums (Amsterdam), bedragen, tekst
   ============================================================ */
const TZ = "Europe/Amsterdam";
const keyFmt = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });
const dayKey = (d) => keyFmt.format(d);
const addDays = (k, n) => { const [y, m, d] = k.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); };
const eachDay = (a, b) => { const o = []; for (let k = a; k <= b; k = addDays(k, 1)) o.push(k); return o; };
const daysBetween = (a, b) => Math.round((Date.parse(b + "T00:00:00Z") - Date.parse(a + "T00:00:00Z")) / 864e5);
const isWorkday = (k) => { const w = new Date(k + "T00:00:00Z").getUTCDay(); return w >= 1 && w <= 5; };
function tzOffsetMs(at) {
  const p = new Intl.DateTimeFormat("en-US", { timeZone: TZ, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" }).formatToParts(at);
  const g = (t) => Number(p.find((x) => x.type === t).value);
  return Date.UTC(g("year"), g("month") - 1, g("day"), g("hour"), g("minute"), g("second")) - at.getTime();
}
const startOfDayUtc = (k) => { const g = new Date(k + "T00:00:00Z"); return new Date(g.getTime() - tzOffsetMs(g)); };

const eurF = new Intl.NumberFormat("nl-NL", { style: "currency", currency: "EUR" });
const eur0 = new Intl.NumberFormat("nl-NL", { style: "currency", currency: "EUR", maximumFractionDigits: 0, minimumFractionDigits: 0 });
function euro(c, round) {
  if (c === null || c === undefined || !isFinite(c)) return "ontbreekt";
  const v = round ? Math.round(c / 100) : Math.round(c) / 100;
  return (round ? eur0 : eurF).format(v === 0 ? 0 : v);
}
const pct = (v, d = 1) => (v === null || v === undefined || !isFinite(v) ? "ontbreekt" : (v * 100).toFixed(d).replace(".", ",") + "%");
const times = (v) => (v === null || v === undefined || !isFinite(v) ? "ontbreekt" : v.toFixed(2).replace(".", ",") + "x");
const nlDay = new Intl.DateTimeFormat("nl-NL", { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" });
const dayL = (k) => (k ? nlDay.format(new Date(String(k).slice(0, 10) + "T00:00:00Z")).replace(/\./g, "") : "ontbreekt");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const cents = (x) => Math.round(Number(x ?? 0) * 100);
const div = (a, b) => (b === 0 ? null : a / b);
function parseEuroInput(s) {
  const t = String(s ?? "").replace(/[€\s]/g, "");
  if (!t) return null;
  const n = Number(t.includes(",") ? t.replace(/\./g, "").replace(",", ".") : t);
  return isFinite(n) ? Math.round(n * 100) : null;
}
const inEuro = (c) => (c === null || c === undefined ? "" : (c / 100).toFixed(2).replace(".", ","));
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 3200); }
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

/* ============================================================
   Periodes
   ============================================================ */
const PRESETS = [["today", "Vandaag"], ["yesterday", "Gisteren"], ["thisweek", "Deze week"], ["lastweek", "Vorige week"], ["mtd", "Deze maand"], ["lastmonth", "Vorige maand"], ["30d", "Laatste 30 dagen"]];
const mondayOf = (k) => addDays(k, -((new Date(k + "T00:00:00Z").getUTCDay() + 6) % 7));
function resolvePeriod(p) {
  const today = dayKey(new Date());
  if (p.preset === "custom" && p.from && p.to && p.from <= p.to) return { preset: "custom", from: p.from, to: p.to, label: "Eigen periode" };
  let from = today, to = today;
  switch (p.preset) {
    case "yesterday": from = to = addDays(today, -1); break;
    case "thisweek": from = mondayOf(today); break;
    case "lastweek": from = addDays(mondayOf(today), -7); to = addDays(from, 6); break;
    case "mtd": from = today.slice(0, 8) + "01"; break;
    case "lastmonth": to = addDays(today.slice(0, 8) + "01", -1); from = to.slice(0, 8) + "01"; break;
    case "30d": from = addDays(today, -29); break;
    case "today": break;
    default: p.preset = "mtd"; from = today.slice(0, 8) + "01";
  }
  return { preset: p.preset, from, to, label: (PRESETS.find((x) => x[0] === p.preset) || [, ""])[1] };
}

/* ============================================================
   Rekenregels (getest in de repository: src/finance/calculations.ts)
   ============================================================ */
function pnl(i, reserveVat) {
  const costs = i.cogs + i.meta + i.fees + i.chargebacks + i.other + i.team;
  const gross = i.revenue - costs;
  const profit = reserveVat ? gross - i.taxes : gross;
  const nonMeta = costs - i.meta;
  return {
    ...i, costs, profit,
    profitAfterVat: gross - i.taxes,
    profitAfterInventory: profit + (i.inventory || 0),
    margin: div(profit, i.revenue),
    mer: div(i.revenue, i.meta),
    breakEven: i.revenue - nonMeta > 0 ? i.revenue / (i.revenue - nonMeta) : null,
    metaShare: div(i.meta, i.revenue), cogsShare: div(i.cogs, i.revenue),
    aov: i.orders ? Math.round(i.revenue / i.orders) : null,
    profitPerOrder: i.orders ? Math.round(profit / i.orders) : null,
    cogsPerOrder: i.orders ? Math.round(i.cogs / i.orders) : null,
  };
}
function forecast(s) {
  const rows = [];
  let bal = s.bank, payable = 0, schedPaid = false, pendDays = 0;
  const pendPart = s.pendingWorkdays ? s.pending / s.pendingWorkdays : 0;
  for (let i = 1; i <= s.days; i++) {
    const date = addDays(s.start, i - 1), wd = isWorkday(date);
    if (i - s.delay >= 1) payable += s.salesDay * s.ratio;
    let shop = 0;
    if (wd) {
      if (!schedPaid && (!s.payoutDate || date >= s.payoutDate)) { shop += s.payout; schedPaid = true; }
      else if (schedPaid && pendDays < s.pendingWorkdays) { shop += pendPart; pendDays++; }
      shop += payable; payable = 0;
    }
    if (s.releaseAmount && s.releaseDate === date) shop += s.releaseAmount;
    const supplier = s.supplierDay === i ? s.supplier : 0;
    const ps = (s.privateWeek + s.softwareWeek) / 7;
    const extra = s.extraDay || 0;
    bal += shop + s.paypalDay - s.metaDay - supplier - ps - extra;
    rows.push({ day: i, date, wd, shop: Math.round(shop), paypal: Math.round(s.paypalDay), meta: Math.round(s.metaDay), supplier: Math.round(supplier), other: Math.round(ps + extra), bal: Math.round(bal) });
  }
  const lowest = rows.reduce((lo, r) => (r.bal < lo.bal ? r : lo), rows[0] || { bal: s.bank, date: s.start });
  const end = rows.length ? rows[rows.length - 1].bal : s.bank;
  return { rows, lowest, end, after7: (rows[Math.min(6, rows.length - 1)] || { bal: s.bank }).bal, change: end - s.bank, belowBuffer: lowest.bal < s.buffer, belowZero: lowest.bal < 0 };
}
function mergeRanges(ranges) {
  const out = [];
  for (const r of [...ranges].filter((r) => r.from <= r.to).sort((a, b) => a.from.localeCompare(b.from))) {
    const last = out[out.length - 1];
    if (last && r.from <= addDays(last.to, 1)) { if (r.to > last.to) last.to = r.to; } else out.push({ ...r });
  }
  return out;
}

/* ============================================================
   Bank: categorieën, regels, Revolut PDF en CSV
   ============================================================ */
const CATEGORIES = [
  ["shopify_payout", "Inkomsten Shopify", "income"], ["paypal_payout", "Inkomsten PayPal", "income"],
  ["loan", "Lening", "debt"], ["owner_deposit", "Eigen storting", "equity"],
  ["meta", "Meta ads", "cost", "meta"], ["cogs", "COGS en verzending", "cost", "cogs"],
  ["private", "Privé", "private"], ["software", "Software en tools", "cost", "other"],
  ["freelancers", "Freelancers", "cost", "other"], ["accountant", "Boekhouder", "cost", "other"],
  ["bank_fees", "Bankkosten", "cost", "other"], ["other_business", "Overig zakelijk", "cost", "other"],
  ["chargebacks", "Chargebacks en disputes", "cost", "chargebacks"], ["team", "Team", "cost", "team"],
  ["internal", "Interne boeking", "neutral"], ["unknown", "Onbekend", "unknown"],
].map(([id, label, kind, bucket]) => ({ id, label, kind, bucket }));
const CAT = Object.fromEntries(CATEGORIES.map((c) => [c.id, c]));
const KIND_LABEL = { income: "omzet (cash)", cost: "kosten", debt: "schuld, geen omzet", equity: "eigen vermogen", private: "opname, geen kosten", neutral: "telt niet mee", unknown: "toewijzen" };
const DEFAULT_RULES = [
  ["Referentie: Lening", "in", "loan", 10], ["HR RJ KOMEN", "any", "loan", 10],
  ["Betaling van GIJS BASTIAAN FONTEIN", "in", "owner_deposit", 10],
  ["Tijdelijk geblokkeerd", "any", "internal", 10], ["Release", "in", "internal", 20],
  ["STRIPE TECHNOLOGY", "in", "shopify_payout", 20], ["PAYPAL", "in", "paypal_payout", 20],
  ["Facebk", "any", "meta", 20], ["Facebook", "any", "meta", 30], ["Meta Platforms", "any", "meta", 30],
  ["Jinjiang Yuguang", "out", "cogs", 20], ["EAST BAITE", "out", "cogs", 20], ["Alibaba", "out", "cogs", 20], ["kungfubuy", "out", "cogs", 20],
  ["To Gijs Bastiaan Fontein", "out", "private", 20], ["As Fontein", "any", "private", 20], ["Frederike", "any", "private", 20],
  ["EUR Personal", "any", "private", 20], ["To EUR Pro", "in", "private", 20],
  ["Chargeback.io", "out", "software", 20], ["Shopify*", "out", "software", 30], ["Klaviyo", "out", "software", 30],
  ["Higgsfield", "out", "software", 30], ["Weglot", "out", "software", 30], ["Gorgias", "out", "software", 30],
  ["OpenAI", "out", "software", 30], ["Google Workspace", "out", "software", 30], ["Apple.com", "out", "software", 30],
  ["rinkel", "out", "software", 30], ["wetracked", "out", "software", 30],
  ["Fiverr", "out", "freelancers", 30], ["OnlineJobs", "out", "freelancers", 30], ["Boekhouding", "out", "accountant", 30],
].map(([pattern, direction, category, priority], i) => ({ id: "d" + i, pattern, direction, category, priority }));

function matchRule(tx, rules) {
  const hay = (tx.ds + "\n" + (tx.dt || "")).toLowerCase();
  const dir = tx.a >= 0 ? "in" : "out";
  for (const r of [...rules].sort((a, b) => a.priority - b.priority)) {
    if (r.direction !== "any" && r.direction !== dir) continue;
    if (hay.includes(String(r.pattern).toLowerCase())) return r;
  }
  return null;
}
/* Revolut telt transferkosten in het afgeschreven bedrag mee; die gaan naar bankkosten. */
function splitAmounts(t) {
  if (!t.f || t.a >= 0) return [[t.c, t.a]];
  return [[t.c, t.a + t.f], ["bank_fees", -t.f]];

function viewMoney() {

  const parts = [["bank", "Bank (Revolut)", p.bank, "Nu beschikbaar", "var(--text)", false, m.bankSrc], ["paypal", "PayPal", p.paypal, "Nu beschikbaar", "var(--s1)", false, s ? "handmatig" : "ontbreekt"], ["payout", "Shopify payout ingepland", p.payout, s && s.payoutDate ? dayL(s.payoutDate) : "Eerstvolgende werkdag", "var(--s3)", false, s ? "handmatig" : "ontbreekt"], ["pending", "Shopify pending", p.pending, "Komende werkdagen", "var(--s4)", false, s ? "handmatig" : "ontbreekt"], ["hold", "Shopify reserve (hold)", p.hold, "Op slot", "var(--s2)", true, s ? "handmatig" : "ontbreekt"]];
  const byLender = {};
  for (const t of allTxs().filter((t) => t.c === "loan")) {
    const n = t.ds.replace(/^(Betaling van|To)\s+/i, "").trim().toUpperCase();
    const x = byLender[n] || (byLender[n] = { n, since: t.d, rec: 0, rep: 0 });
    if (t.a > 0) x.rec += t.a; else x.rep += -t.a;
  }
  const lenders = Object.values(byLender);
  return `
  <section><h1 class="serif" style="font-size:28px">Waar mijn geld staat</h1><p class="sub">Bank: laatste afschrift t/m ${dayL(m.bankDate)}. Shopify en PayPal: ${s ? "stand van " + dayL(s.at) : "nog niet ingevuld"}. Je Shopify-koppeling mag geen saldi lezen, dus die vul je in bij Invoer (1 minuut, uit Shopify, Finances, Payouts).</p></section>
  <section class="grid kpis">${kpi("Totaal", euro(m.total, true))}${kpi("Direct beschikbaar", euro(m.now, true), "bank en PayPal", "good")}${kpi("Binnenkort", euro(m.soon, true), "payout en pending")}${kpi("Op slot", euro(m.locked, true), "Shopify reserve", "neg")}</section>
  <section class="card"><h2>Verdeling</h2>
    ${m.total > 0 ? `<div class="costbar" style="height:38px">${parts.filter((x) => x[2] > 0).map((x) => `<div class="${x[5] ? "hatch" : ""}" title="${esc(x[1])}: ${euro(x[2])}" style="width:${(x[2] / m.total) * 100}%;background-color:${x[4]}"></div>`).join("")}</div>` : ""}
    <div class="scroll" style="margin-top:12px"><table><thead><tr><th>Plek</th><th class="r">Bedrag</th><th class="r">Aandeel</th><th>Beschikbaar</th></tr></thead><tbody>
    ${parts.map((x) => `<tr><td><div class="row" style="gap:6px"><i class="sw ${x[5] ? "hatch" : ""}" style="background-color:${x[4]}"></i>${esc(x[1])}${badge(x[6])}</div></td><td class="r">${euro(x[2])}</td><td class="r muted">${pct(div(x[2], m.total))}</td><td class="${x[5] ? "neg" : "dim"}">${esc(x[3])}</td></tr>`).join("")}
    </tbody><tfoot><tr><td>Totaal</td><td class="r">${euro(m.total)}</td><td></td><td></td></tr></tfoot></table></div>
    <p class="muted" style="font-size:12px;margin:10px 0 0">De ingeplande payout zit niet in pending en wordt apart geteld. Geld op slot is gearceerd.</p>
  </section>
  <section class="card"><h2>Shopify reserve (NDRP)</h2>
    <div class="grid kpis" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">
      <div><div class="dim">Vastgehouden</div><div class="num" style="font-size:20px;font-weight:600">${euro(p.hold)}</div></div>
      <div><div class="dim">Chargeback rate (90 dagen)</div><div style="font-size:20px;font-weight:600">ontbreekt</div><div class="muted" style="font-size:12px">Je Shopify-koppeling mag geen disputes lezen. Exit: 30 dagen achter elkaar onder 1%.</div></div>
    </div></section>
  ${lenders.length ? `<section class="card"><h2>Openstaande schuld ${badge("bank")}</h2><table><tbody>${lenders.map((l) => `<tr><td>Lening ${esc(l.n)}, sinds ${dayL(l.since)}${l.rep ? `, al ${euro(l.rep)} afgelost` : ""}</td><td class="r">${euro(l.rec - l.rep)}</td></tr>`).join("")}</tbody></table><p class="muted" style="font-size:12px;margin:8px 0 0">Een lening is geen omzet. Het geld staat op je bank, maar moet terug.</p></section>` : ""}`;
}

function viewBridge() {
  const f = finance(P()), b = bridge(f);
  charts.wf = { steps: b.steps, end: "Groei bankrekening" };
  return `
  <section><h1 class="serif" style="font-size:28px">Winst naar bank</h1><p class="sub">Waarom je winst niet één op één op je bankrekening verschijnt.</p></section>
  ${b.missing.length ? `<div class="alert l2"><span class="warn">▲</span><div><b>Niet alles is bekend voor deze periode</b><span class="dim">Ontbreekt: ${esc(b.missing.join(", "))}. Timing en afronding is daardoor minder betrouwbaar.</span></div></div>` : ""}
  ${b.warn ? `<div class="alert l2"><span class="warn">▲</span><div><b>Timing en afronding is meer dan 5% van de winst</b><span class="dim">Kijk bij Bank of een leveranciersbetaling bij een andere periode hoort, en pas daar de datum hoort bij periode aan.</span></div></div>` : ""}
  <section class="card"><div class="chart" data-chart="wf"></div></section>
  <section class="card"><h2>Uitleg per stap</h2><div class="scroll"><table><tbody>
    ${b.steps.map((s) => `<tr><td><b>${esc(s.label)}</b><div class="dim" style="font-size:12.5px">${esc(s.ex)}</div></td><td class="r ${s.v < 0 ? "neg" : ""}">${euro(s.v)}</td></tr>`).join("")}
  </tbody><tfoot><tr><td>Groei bankrekening<div class="muted" style="font-weight:400;font-size:12px">van ${euro(b.bankBegin)} naar ${euro(b.bankEnd)}</div></td><td class="r">${euro(b.bankGrowth)}</td></tr></tfoot></table></div>
  <p class="muted" style="font-size:12px;margin:10px 0 0">Shopify-saldo (payout, pending en reserve): begin ${euro(b.shopBegin)}, eind ${euro(b.shopEnd)}.</p></section>`;
}

function viewForecast() {
  if (!S.fc) S.fc = fcSettings();
  const s = S.fc;
  const sl = (k, l, max, step) => `<div class="slider"><label for="fc_${k}"><span class="top"><span class="dim">${l}</span><b class="num" id="fcv_${k}">${euro(s[k], true)}</b></span></label><input type="range" id="fc_${k}" data-fc="${k}" min="0" max="${max}" step="${step}" value="${s[k]}"></div>`;
  return `
  <section><h1 class="serif" style="font-size:28px">Prognose</h1><p class="sub">Banksaldo dag voor dag vanaf ${dayL(s.start)}. Shopify betaalt alleen op werkdagen uit. Schuiven is om mee te rekenen; met Opslaan worden het je standaardwaarden.</p></section>
  <section class="grid" style="grid-template-columns:minmax(0,1fr)">
    <div class="card stack" style="gap:12px">
      <div class="seg" role="group" aria-label="Aantal dagen">${[7, 14, 30].map((n) => `<button type="button" data-fcdays="${n}" aria-pressed="${s.days === n}">${n} dagen</button>`).join("")}</div>
      <div class="formgrid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">
        ${sl("salesDay", "Shopify verkoop per dag", 1000000, 10000)}${sl("metaDay", "Meta per dag", 500000, 5000)}${sl("paypalDay", "PayPal per dag", 150000, 5000)}${sl("privateWeek", "Privé per week", 500000, 10000)}${sl("softwareWeek", "Software per week", 150000, 5000)}${sl("supplier", "Leveranciersbetaling", 2000000, 10000)}${sl("buffer", "Minimale buffer", 1000000, 10000)}
        <div class="slider"><label for="fc_ratio"><span class="top"><span class="dim">Uitbetaald deel nieuwe sales</span><b id="fcv_ratio">${Math.round(s.ratio * 100)}%</b></span></label><input type="range" id="fc_ratio" data-fc="ratio" min="0.6" max="1" step="0.01" value="${s.ratio}"></div>
      </div>
      <div class="formgrid">
        <label>Dag leveranciersbetaling<select class="input" id="fc_supplierDay" data-fcsel="supplierDay"><option value="0">Geen</option>${eachDay(s.start, addDays(s.start, s.days - 1)).map((k, i) => `<option value="${i + 1}" ${s.supplierDay === i + 1 ? "selected" : ""}>Dag ${i + 1}, ${dayL(k)}</option>`).join("")}</select></label>
        <label>Vrijgave reserve, datum<input class="input" type="date" id="fc_releaseDate" data-fcsel="releaseDate" value="${s.releaseDate}"></label>
        <label>Vrijgave reserve, bedrag (€)<input class="input" id="fc_releaseAmount" data-fceur="releaseAmount" inputmode="decimal" value="${inEuro(s.releaseAmount || null)}"></label>
        <label>Teamkosten en overig per dag (€)<input class="input" id="fc_extraDay" data-fceur="extraDay" inputmode="decimal" value="${inEuro(s.extraDay || null)}"></label>
      </div>
      <div class="row"><button class="btn" type="button" data-act="fcSave">Opslaan als standaard</button><button class="btn ghost" type="button" data-act="fcReset">Terug naar standaard</button></div>
    </div>
    <div id="fcResults" class="stack"></div>
  </section>`;
}
function renderForecastResults() {
  const el = document.getElementById("fcResults"); if (!el) return;
  const s = S.fc, a = forecast(s), b = forecast({ ...s, salesDay: 0, paypalDay: 0 });
  const box = (n, f) => `<div class="card" ${f.belowZero || f.belowBuffer ? 'style="border-left:4px solid var(--neg)"' : ""}><b>${n}</b><table style="margin-top:6px"><tbody>
    <tr><td class="dim">Saldo na ${Math.min(7, s.days)} dagen</td><td class="r"><b>${euro(f.after7, true)}</b></td></tr>
    <tr><td class="dim">Laagste punt</td><td class="r ${f.belowZero || f.belowBuffer ? "neg" : ""}">${euro(f.lowest.bal, true)} <span class="muted">${dayL(f.lowest.date)}</span></td></tr>
    <tr><td class="dim">Eindsaldo</td><td class="r">${euro(f.end, true)}</td></tr>
    <tr><td class="dim">Verschil met nu</td><td class="r ${f.change < 0 ? "neg" : "good"}">${euro(f.change, true)}</td></tr></tbody></table>
    ${f.belowZero ? '<p class="neg" style="margin:6px 0 0;font-size:12.5px">Saldo komt onder nul.</p>' : f.belowBuffer ? '<p class="neg" style="margin:6px 0 0;font-size:12.5px">Saldo komt onder je buffer.</p>' : ""}</div>`;
  charts.fc = { dates: a.rows.map((r) => r.date), zero: true, series: [{ label: "Sales lopen door", color: "var(--c-profit)", values: a.rows.map((r) => r.bal) }, { label: "Alleen wat al klaarstaat", color: "var(--c-meta)", dashed: true, values: b.rows.map((r) => r.bal) }] };
  el.innerHTML = `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${box("Sales lopen door", a)}${box("Alleen wat al klaarstaat", b)}</div>
  <div class="card"><div class="chart" data-chart="fc"></div></div>
  <div class="card scroll" style="padding:0"><table><thead><tr><th>Dag</th><th class="r">Shopify in</th><th class="r">PayPal in</th><th class="r">Meta</th><th class="r">Leverancier</th><th class="r">Privé, software</th><th class="r">Saldo</th></tr></thead><tbody>
    <tr class="muted"><td>Nu</td><td colspan="5"></td><td class="r">${euro(s.bank, true)}</td></tr>
    ${a.rows.map((r) => `<tr><td style="white-space:nowrap">${dayL(r.date)}${r.wd ? "" : ' <span class="muted">weekend</span>'}</td><td class="r">${r.shop ? euro(r.shop, true) : ""}</td><td class="r">${r.paypal ? euro(r.paypal, true) : ""}</td><td class="r">${r.meta ? euro(-r.meta, true) : ""}</td><td class="r">${r.supplier ? euro(-r.supplier, true) : ""}</td><td class="r">${r.other ? euro(-r.other, true) : ""}</td><td class="r ${r.bal < 0 ? "neg" : r.bal < s.buffer ? "warn" : ""}"><b>${euro(r.bal, true)}</b></td></tr>`).join("")}
  </tbody></table></div>
  <p class="muted" style="font-size:12px;margin:0">Eerst de ingeplande payout, dan pending verdeeld over 3 werkdagen, daarna nieuwe verkopen na ${s.delay} dagen als ${Math.round(s.ratio * 100)}% van de verkoop. Verkopen die in het weekend uitbetaalbaar worden, komen maandag binnen.</p>`;
  drawCharts();
}

function viewMeta() {
  const f = finance(P()), s = S.settings;
  const aggr = (keyFn) => {
    const m = {};
    for (const r of f.metaRows) { const k = keyFn(r); const a = m[k] || (m[k] = { k, spend: 0, clicks: 0, imp: 0, pur: 0, val: 0, fw: 0 }); a.spend += r.spend; a.clicks += r.clicks; a.imp += r.impressions; a.pur += r.purchases; a.val += r.value; a.fw += (r.freq || 0) * r.impressions; }
    return Object.values(m).sort((a, b) => b.spend - a.spend);
  };
  const table = (rows, label) => `<div class="scroll"><table><thead><tr><th>${label}</th><th class="r">Spend</th><th class="r">Aankopen</th><th class="r">Omzet (Meta)</th><th class="r">ROAS</th><th class="r">CPC</th><th class="r">CPM</th><th class="r">Frequency</th></tr></thead><tbody>
    ${rows.map((a) => { const roas = div(a.val, a.spend), fr = a.imp ? a.fw / a.imp : null; return `<tr><td style="max-width:18rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(a.k)}">${esc(a.k)}</td><td class="r">${euro(a.spend, true)}</td><td class="r">${a.pur}</td><td class="r">${euro(a.val, true)}</td><td class="r ${roas !== null && roas < s.breakEven ? "neg" : "good"}"><b>${times(roas)}</b></td><td class="r">${a.clicks ? euro(Math.round(a.spend / a.clicks)) : "ontbreekt"}</td><td class="r">${a.imp ? euro(Math.round((a.spend / a.imp) * 1000)) : "ontbreekt"}</td><td class="r ${fr !== null && fr >= 2.5 ? "warn" : ""}">${fr === null ? "" : fr.toFixed(2).replace(".", ",")}</td></tr>`; }).join("") || `<tr><td colspan="8" class="empty">${S.meta.status === "laden" ? "Laden…" : S.meta.status === "fout" ? esc(S.meta.err) : "Geen Meta-data in deze periode."}</td></tr>`}
  </tbody></table></div>`;
  const value = f.metaRows.reduce((a, r) => a + r.value, 0), spend = f.metaSpend || 0;
  const bl = [...S.budget].sort((a, b) => a.date.localeCompare(b.date));
  const warnFor = (c, i) => {
    const w = [];
    if (c.old > 0 && (c.nw - c.old) / c.old > 0.2) w.push(`Verhoging van ${Math.round(((c.nw - c.old) / c.old) * 100)}%, meer dan 20%`);
    const prev = bl.slice(0, i).reverse().find((x) => x.campaign === c.campaign);
    if (prev && daysBetween(prev.date, c.date) < 3) w.push(`Maar ${daysBetween(prev.date, c.date)} dag(en) na de vorige ingreep, minimaal 3`);
    if (bl.some((x) => x !== c && x.date === c.date)) w.push("Meerdere ingrepen op dezelfde dag");
    return w;
  };
  return `
  <section><h1 class="serif" style="font-size:28px">Meta ads</h1><p class="sub">Live uit Windsor.ai. Break-even afspraak ${times(s.breakEven)}, rood is eronder.</p></section>
  <section class="grid kpis">${kpi("Spend", euro(spend, true), badge(S.meta.status === "ok" ? "Meta" : "ontbreekt"))}${kpi("Betaald (bank)", euro(f.metaPaid, true), "loopt achter op spend")}${kpi("Omzet volgens Meta", euro(value, true), "ROAS " + times(div(value, spend)))}${kpi("Omzet Shopify", euro(f.res.revenue, true), "MER " + times(div(f.res.revenue, spend)), spend && f.res.revenue / spend < s.breakEven ? "neg" : "")}${kpi("Meta %", pct(div(spend, f.res.revenue)), "spend / omzet")}${kpi("Break-even", times(f.res.breakEven), "berekend, afspraak " + times(s.breakEven))}</section>
  <section class="card"><h2>Per campagne</h2>${table(aggr((r) => r.campaign), "Campagne")}<p class="muted" style="font-size:12px;margin:8px 0 0">CPC = spend / clicks. Frequency oranje vanaf 2,5: tijd voor nieuwe creatives.</p></section>
  <section class="card"><h2>Per markt</h2>${table(aggr((r) => marketOf(r.campaign)), "Markt")}</section>
  <section class="card"><h2>Budgetwijzigingen</h2><p class="dim" style="margin:0 0 10px">Protocol: max 20% per ingreep, minimaal 3 tot 4 dagen ertussen, nooit twee ingrepen tegelijk.</p>
    <form data-form="budget" class="row"><input class="input" type="date" id="b_date" value="${dayKey(new Date())}" required><input class="input" id="b_campaign" list="campaigns" placeholder="Campagne" required style="width:240px"><datalist id="campaigns">${[...new Set(S.meta.rows.map((r) => r.campaign))].map((c) => `<option value="${esc(c)}">`).join("")}</datalist><input class="input" id="b_old" placeholder="oud budget" inputmode="decimal" required style="width:110px"><input class="input" id="b_new" placeholder="nieuw budget" inputmode="decimal" required style="width:110px"><button class="btn" type="submit">Toevoegen</button></form>
    <div class="scroll" style="margin-top:10px"><table><tbody>${bl.map((c, i) => ({ c, w: warnFor(c, i) })).reverse().map(({ c, w }) => `<tr><td style="white-space:nowrap">${dayL(c.date)}</td><td>${esc(c.campaign)}</td><td class="r">${euro(c.old)} naar ${euro(c.nw)}</td><td>${w.map((x) => `<div class="neg" style="font-size:12px">${esc(x)}</div>`).join("")}</td><td class="r"><button class="btn ghost" style="padding:2px 8px" type="button" data-act="delBudget" data-id="${c.id}">verwijder</button></td></tr>`).join("") || '<tr><td class="muted">Nog geen wijzigingen gelogd.</td></tr>'}</tbody></table></div>
  </section>`;
}

function viewBank() {
  const p = P(), fl = S.bankFilter;
  const txs = allTxs().filter((t) => { const e = t.pd || t.d; return e >= p.from && e <= p.to; });
  const tot = totalsByCategory(txs);
  const shown = txs.filter((t) => (!fl.cat || t.c === fl.cat) && (!fl.q || (t.ds + " " + t.dt).toLowerCase().includes(fl.q.toLowerCase())));
  const cov = coverage();
  const r = rules();
  return `
  <section><h1 class="serif" style="font-size:28px">Bank</h1><p class="sub">Revolut Pro. Upload je afschrift van elke periode; overlap wordt overgeslagen. Mutaties tellen in de periode van hun datum hoort bij periode.</p></section>
  <section class="grid two">
    <div class="card"><h2>Afschrift uploaden</h2>${uploadForm("bankUpload")}
      <p class="muted" style="font-size:12px;margin:10px 0 0">Gedekt: ${cov.merged.map((x) => dayL(x.from) + " t/m " + dayL(x.to)).join(", ") || "nog niets"}. Het afschrift zelf wordt niet bewaard, alleen de mutaties.</p></div>
    <div class="card"><h2>Totalen in deze periode</h2><table><tbody>
      ${CATEGORIES.filter((c) => tot[c.id] !== undefined).map((c) => `<tr><td><button class="btn ghost" style="padding:2px 8px;border:0" type="button" data-bankcat="${c.id}">${esc(c.label)}</button> <span class="muted" style="font-size:11.5px">${KIND_LABEL[c.kind]}</span></td><td class="r ${tot[c.id] > 0 ? "good" : ""}">${euro(tot[c.id])}</td></tr>`).join("") || '<tr><td class="muted">Geen mutaties in deze periode.</td></tr>'}
    </tbody></table></div>
  </section>
  <section class="card">
    <form data-form="bankFilter" class="row" style="margin-bottom:10px"><input class="input" id="bf_q" placeholder="Zoek omschrijving…" value="${esc(fl.q)}" style="width:220px"><select class="input" id="bf_cat"><option value="">Alle categorieën</option>${CATEGORIES.map((c) => `<option value="${c.id}" ${fl.cat === c.id ? "selected" : ""}>${esc(c.label)}</option>`).join("")}</select><button class="btn ghost" type="submit">Filter</button>${fl.cat || fl.q ? '<button class="btn ghost" type="button" data-act="clearFilter">Wis filter</button>' : ""}<span class="muted" style="margin-left:auto">${shown.length} mutaties</span></form>
    <div class="scroll"><table><thead><tr><th>Datum</th><th>Omschrijving</th><th class="r">Bedrag</th><th>Categorie</th><th>Hoort bij</th><th></th></tr></thead><tbody>
    ${shown.map((t) => `<tr ${t.c === "unknown" ? 'style="background:var(--surface-2)"' : ""}><td style="white-space:nowrap">${dayL(t.d)}</td><td style="max-width:26rem"><b>${esc(t.ds)}</b><div class="muted" style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(t.dt)}">${esc(String(t.dt || "").split("\n").filter((l) => !l.startsWith("Kaart:")).join(", "))}</div>${t.n ? `<div class="warn" style="font-size:12px">${esc(t.n)}</div>` : ""}</td>
      <td class="r ${t.a > 0 ? "good" : ""}">${euro(t.a)}${t.f ? `<div class="muted" style="font-size:11.5px">waarvan ${euro(t.f)} kosten</div>` : ""}</td>
      <td><select class="input pillsel" data-txcat="${t.k}" aria-label="Categorie">${CATEGORIES.map((c) => `<option value="${c.id}" ${t.c === c.id ? "selected" : ""}>${esc(c.label)}</option>`).join("")}</select>${t.cs === "handmatig" ? '<div class="warn" style="font-size:11px">handmatig</div>' : ""}</td>
      <td><input class="input" type="date" data-txpd="${t.k}" value="${t.pd || t.d}" style="width:140px;${t.pd ? "border-color:var(--warn)" : ""}" aria-label="Hoort bij periode"></td>
      <td><button class="btn ghost" style="padding:2px 8px" type="button" data-act="ruleFromTx" data-k="${t.k}" title="Maak een regel zodat dit voortaan automatisch gaat">regel</button></td></tr>`).join("") || `<tr><td colspan="6" class="empty">${allTxs().length ? "Geen mutaties voor dit filter en deze periode." : "Nog geen bankmutaties. Upload je Revolut-afschrift."}</td></tr>`}
    </tbody></table></div>
  </section>

/* ---------- grafieken (SVG, breedte volgt de container) ---------- */
const fmtAxis = (v, f) => (f === "x" ? v.toFixed(1).replace(".", ",") + "x" : eur0.format(v / 100));
function niceStep(range) { const raw = range / 4 || 1, mag = 10 ** Math.floor(Math.log10(raw)), n = raw / mag; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag; }
function drawLine(el, spec) {
  const W = Math.max(280, el.clientWidth), H = 230, PL = spec.fmt === "x" ? 44 : 64, PR = 10, PT = 12, PB = 24;
  const all = spec.series.flatMap((s) => s.values.filter((v) => v !== null && isFinite(v)));
  if (spec.ref) all.push(spec.ref.v); if (spec.zero) all.push(0);
  if (!all.length) { el.innerHTML = '<p class="muted" style="padding:40px 0;text-align:center">Nog geen data.</p>'; return; }
  const max = Math.max(...all, 0), min = Math.min(...all, 0), step = niceStep(max - min), top = Math.ceil(max / step) * step || step, bot = Math.floor(min / step) * step;
  const iw = W - PL - PR, ih = H - PT - PB, n = spec.dates.length;
  const x = (i) => PL + (n <= 1 ? iw / 2 : (i / (n - 1)) * iw), y = (v) => PT + ((top - v) / (top - bot || 1)) * ih;
  const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 80))));
  let g = "";
  for (let v = bot; v <= top + step / 2; v += step) g += `<line x1="${PL}" x2="${W - PR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${PL - 7}" y="${y(v)}" dy="0.32em" text-anchor="end" font-size="11" fill="var(--text-3)">${fmtAxis(v, spec.fmt)}</text>`;
  if (spec.zero) g += `<line x1="${PL}" x2="${W - PR}" y1="${y(0)}" y2="${y(0)}" stroke="var(--neg)" stroke-dasharray="4 4" stroke-width="1.5"/>`;
  if (spec.ref) g += `<line x1="${PL}" x2="${W - PR}" y1="${y(spec.ref.v)}" y2="${y(spec.ref.v)}" stroke="var(--text-3)" stroke-dasharray="4 4"/><text x="${W - PR}" y="${y(spec.ref.v) - 5}" text-anchor="end" font-size="11" fill="var(--text-2)">${esc(spec.ref.label)}</text>`;
  spec.dates.forEach((d, i) => { if (i % every === 0) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--text-3)">${dayL(d)}</text>`; });
  for (const s of spec.series) {
    let d = ""; s.values.forEach((v, i) => { if (v === null || !isFinite(v)) return; d += (d && s.values[i - 1] !== null ? "L" : "M") + x(i).toFixed(1) + "," + y(v).toFixed(1); });
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.dashed ? 'stroke-dasharray="5 4"' : ""}/>`;
  }
  const legend = spec.series.length > 1 ? `<div class="chartlegend">${spec.series.map((s) => `<span><i style="background:${s.color}"></i>${esc(s.label)}</span>`).join("")}</div>` : "";
  el.innerHTML = `${legend}<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(spec.series.map((s) => s.label).join(", "))}">${g}<g class="hov"></g><rect x="${PL}" y="${PT}" width="${iw}" height="${ih}" fill="transparent"/></svg><div class="tip" hidden></div>`;
  const svg = el.querySelector("svg"), hov = el.querySelector(".hov"), tip = el.querySelector(".tip");
  const fv = (v) => (v === null || !isFinite(v) ? "ontbreekt" : spec.fmt === "x" ? times(v) : euro(v, true));
  svg.addEventListener("pointermove", (ev) => {
    const r = svg.getBoundingClientRect(), px = ((ev.clientX - r.left) / r.width) * W;
    const i = Math.max(0, Math.min(n - 1, Math.round(((px - PL) / iw) * (n - 1))));
    hov.innerHTML = `<line x1="${x(i)}" x2="${x(i)}" y1="${PT}" y2="${H - PB}" stroke="var(--text-3)"/>` + spec.series.map((s) => (s.values[i] === null || !isFinite(s.values[i]) ? "" : `<circle cx="${x(i)}" cy="${y(s.values[i])}" r="4.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`)).join("");
    tip.hidden = false;
    tip.innerHTML = `<b>${dayL(spec.dates[i])}</b>` + spec.series.map((s) => `<div><span class="dim">${esc(s.label)}</span><span class="num">${fv(s.values[i])}</span></div>`).join("");
    tip.style.left = Math.min(Math.max((x(i) / W) * 100 - 12, 0), 60) + "%";
  });
  svg.addEventListener("pointerleave", () => { hov.innerHTML = ""; tip.hidden = true; });
}
function drawWaterfall(el, spec) {
  const W = Math.max(320, el.clientWidth), H = 290, PT = 26, PB = 58, PX = 6;
  const all = [...spec.steps, { key: "end", label: spec.end, v: spec.steps.reduce((a, s) => a + s.v, 0) }];
  let run = 0;
  const bars = all.map((s, i) => { const end = i === all.length - 1; const st = end || i === 0 ? 0 : run; const en = end ? s.v : i === 0 ? s.v : run + s.v; if (!end) run = i === 0 ? s.v : run + s.v; return { ...s, st, en, end, first: i === 0 }; });
  const vals = bars.flatMap((b) => [b.st, b.en, 0]), max = Math.max(...vals), min = Math.min(...vals);
  const ih = H - PT - PB, y = (v) => PT + ((max - v) / (max - min || 1)) * ih, slot = (W - 2 * PX) / bars.length, bw = Math.min(64, slot * 0.6);
  let g = `<line x1="${PX}" x2="${W - PX}" y1="${y(0)}" y2="${y(0)}" stroke="var(--grid)" stroke-width="1.5"/>`;
  bars.forEach((b, i) => {
    const bx = PX + i * slot + (slot - bw) / 2, t = y(Math.max(b.st, b.en)), h = Math.max(1, Math.abs(y(b.st) - y(b.en)));
    const col = b.first ? "var(--c-profit)" : b.end ? "var(--text)" : b.v >= 0 ? "var(--good)" : "var(--neg)";
    g += `<rect x="${bx}" y="${t}" width="${bw}" height="${h}" rx="3" fill="${col}" opacity="${b.first || b.end ? 1 : 0.85}"/>`;
    if (i < bars.length - 1) g += `<line x1="${bx + bw}" x2="${bx + slot}" y1="${y(b.en)}" y2="${y(b.en)}" stroke="var(--text-3)" stroke-dasharray="2 3"/>`;
    g += `<text x="${bx + bw / 2}" y="${t - 6}" text-anchor="middle" font-size="${W < 520 ? 10 : 12}" font-weight="500" fill="var(--text)">${b.v > 0 && !b.first && !b.end ? "+" : ""}${euro(b.v, true)}</text>`;
    g += `<foreignObject x="${PX + i * slot}" y="${H - PB + 8}" width="${slot}" height="${PB}"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:${W < 520 ? 10 : 11.5}px;line-height:1.2;text-align:center;color:var(--text-2);padding:0 2px">${esc(b.label)}</div></foreignObject>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Van winst naar bankrekening">${g}</svg>`;
}
function drawCharts() {
  document.querySelectorAll("[data-chart]").forEach((el) => {

async function importFiles(files) {
  const results = [];
  const rs = rules();
  for (const file of files) {
    try {
      const isPdf = /\.pdf$/i.test(file.name) || file.type === "application/pdf";
      const st = isPdf ? await parseRevolutPdf(await file.arrayBuffer()) : parseRevolutCsv(await file.text());
      const rec = reconcile(st);
      const seen = {};
      const txs = st.txs.map((t, i) => {
        const base = [t.d, t.a, t.b ?? "", t.ds].join("|"); const occ = seen[base] || 0; seen[base] = occ + 1;
        const r = matchRule(t, rs);
        return { k: base + "|" + occ, d: t.d, ds: t.ds, dt: t.dt, a: t.a, f: t.f || 0, b: t.b ?? null, c: r ? r.category : "unknown", cs: "regel", i };
      });
      const byMonth = {};
      for (const t of txs) (byMonth[t.d.slice(0, 7)] = byMonth[t.d.slice(0, 7)] || []).push(t);
      let added = 0;
      for (const [m, list] of Object.entries(byMonth)) {
        await writeDoc(`bank/${m}`, (cur) => {
          const have = (cur && cur.txs) || [];
          const keys = new Set(have.map((t) => t.k));
          const fresh = list.filter((t) => !keys.has(t.k));
          added += fresh.length;
          if (!fresh.length) return null;
          const merged = [...have, ...fresh].sort((a, b) => a.d.localeCompare(b.d) || (a.i || 0) - (b.i || 0));
          return { txs: merged };
        });
      }
      const info = { file: file.name, from: st.from, to: st.to, n: txs.length, added, dup: txs.length - added, ok: rec.ok, opening: rec.opening, closing: rec.closing, unknown: txs.filter((t) => t.c === "unknown").length, at: new Date().toISOString() };
      results.push(info);
      await writeDoc("config/imports", (cur) => ({ list: [...((cur && cur.list) || []), { file: info.file, from: info.from, to: info.to, n: info.n, ok: info.ok, at: info.at }].slice(-200) }));
    } catch (e) { results.push({ file: file.name, error: e && e.message ? e.message : String(e) }); }
  }
  S.lastImport = results; render();
}
async function recategorize(newRules) {
  for (const m of Object.keys(S.bank)) {
    await writeDoc(`bank/${m}`, (cur) => {
      if (!cur) return null;
      let changed = false;
      const txs = cur.txs.map((t) => { if (t.cs === "handmatig") return t; const r = matchRule(t, newRules); const c = r ? r.category : "unknown"; if (c !== t.c) { changed = true; return { ...t, c }; } return t; });
      return changed ? { txs } : null;
    });
  }
}
function updateTx(k, patch) {
  const m = allTxs().find((t) => t.k === k); if (!m) return;
  return writeDoc(`bank/${m.d.slice(0, 7)}`, (cur) => (cur ? { txs: cur.txs.map((t) => (t.k === k ? { ...t, ...patch } : t)) } : null));
}
function saveRules(list) { return writeDoc("config/rules", () => ({ rules: list })).then(() => recategorize(list)); }
const saveManual = (fn) => writeDoc("config/manual", (cur) => ({ entries: fn((cur && cur.entries) || []) }));
const val = (id) => (document.getElementById(id) || {}).value || "";

document.addEventListener("click", (e) => {

    const tx = allTxs().find((x) => x.k === t.dataset.k); if (!tx) return;
    if (tx.c === "unknown") { toast("Kies eerst een categorie, klik daarna op regel."); return; }
    const pattern = tx.ds.replace(/^(To|Betaling van)\s+/i, "").trim();
    saveRules([...rules(), { id: uid(), pattern, direction: tx.a >= 0 ? "in" : "out", category: tx.c, priority: 15 }]).then(() => toast(`Regel gemaakt: "${pattern}" wordt voortaan ${CAT[tx.c].label}`));
  }
  if (act === "delManual") saveManual((l) => l.filter((x) => x.id !== t.dataset.id));
  if (act === "toggleInvoice") saveManual((l) => l.map((x) => (x.id === t.dataset.id ? { ...x, paid: !x.paid } : x)));
  if (act === "delBalance") writeDoc("config/balances", (cur) => ({ entries: ((cur && cur.entries) || []).filter((x) => x.id !== t.dataset.id) }));
  if (act === "delBudget") writeDoc("config/budget", (cur) => ({ entries: ((cur && cur.entries) || []).filter((x) => x.id !== t.dataset.id) }));
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.txcat) { updateTx(t.dataset.txcat, { c: t.value, cs: "handmatig" }); return; }
  if (t.dataset.txpd) { const tx = allTxs().find((x) => x.k === t.dataset.txpd); if (tx) updateTx(tx.k, { pd: t.value && t.value !== tx.d ? t.value : null }); return; }
  if (t.dataset.fcsel) { S.fc[t.dataset.fcsel] = t.dataset.fcsel === "supplierDay" ? Number(t.value) : t.value; renderForecastResults(); return; }
  if (t.dataset.fceur) { S.fc[t.dataset.fceur] = parseEuroInput(t.value) || 0; renderForecastResults(); return; }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.fc) {
    const k = t.dataset.fc; S.fc[k] = Number(t.value);
    const lab = document.getElementById("fcv_" + k); if (lab) lab.textContent = k === "ratio" ? Math.round(S.fc[k] * 100) + "%" : euro(S.fc[k], true);
    renderForecastResults();
  }
});
document.addEventListener("submit", (e) => {
  const f = e.target; e.preventDefault();
  if (f.id === "customPeriod") { const a = val("pFrom"), b = val("pTo"); if (a && b && a <= b) { S.periodSel = { preset: "custom", from: a, to: b }; store.set("mm.period", S.periodSel); render(); loadRemote(false); } return; }
  const kind = f.dataset.form;
  if (kind === "upload") { const files = [...f.querySelector("input[type=file]").files]; if (!files.length) { toast("Kies een PDF- of CSV-bestand"); return; } toast("Afschrift inlezen…"); importFiles(files).then(() => f.reset()); return; }
  if (kind === "bankFilter") { S.bankFilter = { cat: val("bf_cat"), q: val("bf_q") }; document.activeElement && document.activeElement.blur(); render(); return; }
  if (kind === "rule") { const pattern = val("r_pattern").trim(); if (!pattern) return; saveRules([...rules(), { id: uid(), pattern, direction: val("r_dir"), category: val("r_cat"), priority: Number(val("r_prio")) || 50 }]).then(() => toast("Regel toegevoegd en toegepast")); f.reset(); return; }
  if (kind === "balance") {
    const c = (id) => parseEuroInput(val(id)) ?? 0;
    const entry = { id: uid(), at: val("bal_at"), payout: c("bal_payout"), payoutDate: val("bal_payoutDate") || null, pending: c("bal_pending"), hold: c("bal_hold"), paypal: c("bal_paypal") };
    writeDoc("config/balances", (cur) => ({ entries: [...((cur && cur.entries) || []), entry] })).then(() => toast("Stand opgeslagen")); return;
  }
  if (kind === "team") { const a = parseEuroInput(val("t_amount")); if (a === null) return; saveManual((l) => [...l, { id: uid(), kind: "team_month", label: val("t_name"), amount: a, from: val("t_from"), to: val("t_to") || null }]).then(() => toast("Teamkosten toegevoegd")); f.reset(); return; }
  if (kind === "manual") { const a = parseEuroInput(val("m_amount")); if (a === null) return; saveManual((l) => [...l, { id: uid(), kind: val("m_kind"), label: val("m_label"), amount: a, from: val("m_from"), to: val("m_to") || val("m_from") }]).then(() => toast("Post toegevoegd")); f.reset(); return; }
  if (kind === "invoice") { const a = parseEuroInput(val("i_amount")); if (a === null) return; saveManual((l) => [...l, { id: uid(), kind: "open_invoice", label: val("i_sup"), amount: a, due: val("i_due") || null, paid: false }]).then(() => toast("Factuur toegevoegd")); f.reset(); return; }
  if (kind === "budget") { const o = parseEuroInput(val("b_old")), n = parseEuroInput(val("b_new")); if (o === null || n === null) return; writeDoc("config/budget", (cur) => ({ entries: [...((cur && cur.entries) || []), { id: uid(), date: val("b_date"), campaign: val("b_campaign"), old: o, nw: n }] })).then(() => toast("Wijziging gelogd")); f.reset(); return; }
  if (kind === "settings") {
    const num = (id, d) => { const n = Number(String(val(id)).replace(",", ".")); return isFinite(n) && val(id) !== "" ? n : d; };
    const s = S.settings;
    writeDoc("config/settings", (cur) => ({ ...DEFAULT_SETTINGS, ...(cur || {}), reserveVat: document.getElementById("s_reserveVat").checked, breakEven: num("s_breakEven", s.breakEven), buffer: parseEuroInput(val("s_buffer")) ?? s.buffer, softwareWeek: parseEuroInput(val("s_softwareWeek")) ?? s.softwareWeek, payoutRatio: num("s_payoutRatio", s.payoutRatio * 100) / 100, payoutDelay: num("s_payoutDelay", s.payoutDelay), forecastDays: num("s_forecastDays", s.forecastDays) })).then(() => { S.fc = null; toast("Instellingen opgeslagen"); });
  }
});

/* ============================================================
   Excel-export met echte formules (tabbladen zoals in de spec)
   ============================================================ */
function loadXlsx() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    sc.onload = () => res(window.XLSX);
    sc.onerror = () => rej(new Error("De Excel-module kon niet laden. Probeer het opnieuw."));
    document.head.appendChild(sc);
  });
}
const Z_EUR = '€ #,##0.00;[Red]-€ #,##0.00', Z_PCT = "0.0%", Z_X = '0.00"x"';
const nE = (c) => (c === null || c === undefined ? "" : { t: "n", v: Math.round(c) / 100, z: Z_EUR });
const fx = (f, z = Z_EUR) => ({ t: "n", f, z });
function buildWorkbook(X) {
  const p = P(), f = finance(p), r = f.res, m = moneyNow(), b = bridge(f);
  const wb = X.utils.book_new();
  const add = (name, rows, widths) => { const ws = X.utils.aoa_to_sheet(rows); ws["!cols"] = widths.map((w) => ({ wch: w })); X.utils.book_append_sheet(wb, ws, name); };
  const src = (key) => (f.lines.find((l) => l.key === key) || { src: [] }).src.join(", ");
  const title = [`ModernoMilano cijfers, ${p.from} t/m ${p.to}`];

  // Overzicht: rij 4 omzet, 5 t/m 10 kosten, 11 btw-reservering, 12 winst
  add("Overzicht", [
    title, [],
    ["Post", "Bedrag", "% van omzet", "Bron"],
    ["Omzet (incl. btw)", nE(r.revenue), fx("B4/$B$4", Z_PCT), src("revenue")],
    ["COGS en verzending", nE(r.cogs), fx("B5/$B$4", Z_PCT), src("cogs")],
    ["Meta ads", nE(r.meta), fx("B6/$B$4", Z_PCT), src("meta")],
    ["Shopify en PayPal fees", nE(r.fees), fx("B7/$B$4", Z_PCT), src("fees")],
    ["Chargebacks en disputes", nE(r.chargebacks), fx("B8/$B$4", Z_PCT), src("chargebacks")],
    ["Software, freelancers, boekhouder, bank", nE(r.other), fx("B9/$B$4", Z_PCT), src("other")],
    ["Teamkosten", nE(r.team), fx("B10/$B$4", Z_PCT), src("team")],
    ["Btw gereserveerd", nE(S.settings.reserveVat ? r.taxes : 0), fx("B11/$B$4", Z_PCT), S.settings.reserveVat ? "instelling aan" : "instelling uit (btw fix)"],
    ["Winst", fx("B4-SUM(B5:B11)"), fx("B12/$B$4", Z_PCT)],
    [],
    ["Marge", fx("B12/B4", Z_PCT)],
    ["MER (omzet / Meta)", fx("B4/B6", Z_X)],
    ["Break-even ROAS", fx("B4/(B4-(B5+B7+B8+B9+B10))", Z_X)],
    ["Break-even afspraak", { t: "n", v: S.settings.breakEven, z: Z_X }],
    ["Orders", { t: "n", v: r.orders }],
    ["AOV", fx("B4/B18")],
    ["Winst per order", fx("B12/B18")],
    ["Btw in de omzet", nE(r.taxes)],
    ["Winst als btw afgedragen moet worden", fx("B4-SUM(B5:B10)-B21")],
    ["Meta betaald via bank", nE(f.metaPaid)],
  ], [40, 16, 13, 30]);

  add("Geld", [
    title, [],
    ["Plek", "Bedrag", "Beschikbaar"],
    ["Bank (Revolut)", nE(m.pos.bank), "nu"],
    ["PayPal", nE(m.pos.paypal), "nu"],
    ["Shopify payout ingepland", nE(m.pos.payout), m.snap && m.snap.payoutDate ? m.snap.payoutDate : "eerstvolgende werkdag"],
    ["Shopify pending", nE(m.pos.pending), "komende werkdagen"],
    ["Shopify reserve (hold)", nE(m.pos.hold), "op slot"],
    ["Totaal", fx("SUM(B4:B8)")],
    [],
    ["Direct beschikbaar", fx("B4+B5")],
    ["Binnenkort", fx("B6+B7")],
    ["Op slot", fx("B8")],
    [],
    ["Stand Shopify en PayPal van", m.snap ? m.snap.at : "ontbreekt"],
    ["Bank volgens afschrift t/m", m.bankDate || "ontbreekt"],
  ], [30, 16, 24]);

  const priv = b.steps.find((x) => x.key === "priv").v, loans = b.steps.find((x) => x.key === "loans").v;
  add("Winst naar bank", [
    title, [],
    ["Stap", "Bedrag", "Uitleg"],
    ["Winst", fx("Overzicht!B12"), "uit het tabblad Overzicht"],
    ["Shopify-saldo begin", nE(b.shopBegin), "payout + pending + reserve"],
    ["Shopify-saldo eind", nE(b.shopEnd), ""],
    ["Nog bij Shopify", fx("-(B6-B5)"), "groei van wat Shopify vasthoudt"],
    ["Naar privé", nE(priv), "opnames, geen kosten"],
    ["Meta verbruikt", fx("Overzicht!B6"), ""],
    ["Meta betaald via bank", fx("Overzicht!B23"), ""],
    ["Meta verbruikt min betaald", fx("B9-B10"), ""],
    ["Lening en stortingen", nE(loans), "geen omzet, wel geld op de bank"],
    ["Banksaldo begin", nE(b.bankBegin), ""],
    ["Banksaldo eind", nE(b.bankEnd), ""],
    ["Groei bankrekening", fx("B14-B13"), ""],
    ["Timing en afronding", fx("B15-(B4+B7+B8+B11+B12)"), "wat de stappen niet verklaren"],
    ["Controle (moet 0 zijn)", fx("B4+B7+B8+B11+B12+B16-B15"), ""],
  ], [30, 16, 38]);

  const fs = S.fc || fcSettings(), fc = forecast(fs);
  const fcRows = [["Prognose vanaf " + fs.start, "", "", "", "", "", "", ""], [], ["Datum", "Werkdag", "Shopify in", "PayPal in", "Meta", "Leverancier", "Privé en software", "Saldo"], ["Nu", "", "", "", "", "", "", nE(fs.bank)]];
  fc.rows.forEach((x, i) => { const row = 5 + i; fcRows.push([x.date, x.wd ? "ja" : "nee", nE(x.shop), nE(x.paypal), nE(x.meta), nE(x.supplier), nE(x.other), fx(`H${row - 1}+C${row}+D${row}-E${row}-F${row}-G${row}`)]); });
  const last = 4 + fc.rows.length;
  fcRows.push([], ["Laagste saldo", "", "", "", "", "", "", fx(`MIN(H5:H${last})`)], ["Buffer", "", "", "", "", "", "", nE(fs.buffer)], ["Onder buffer?", "", "", "", "", "", "", { t: "s", f: `IF(H${last + 2}<H${last + 3},"ja","nee")` }]);
  add("Prognose", fcRows, [14, 9, 13, 12, 12, 13, 17, 14]);

  const txs = allTxs().filter((t) => { const e = t.pd || t.d; return e >= p.from && e <= p.to; });
  const txRows = [["Datum", "Hoort bij", "Omschrijving", "Categorie", "Bedrag", "Waarvan transferkosten", "Bedrag excl. kosten", "Saldo", "Details"]];
  txs.forEach((t, i) => { const row = 2 + i; txRows.push([t.d, t.pd || t.d, t.ds, CAT[t.c] ? CAT[t.c].label : t.c, nE(t.a), nE(t.f || 0), fx(`E${row}+F${row}`), nE(t.b), String(t.dt || "").replace(/\n/g, ", ")]); });
  const n = txs.length + 1;
  txRows[0].push("", "Categorie", "Totaal");
  CATEGORIES.forEach((c, i) => {
    const row = 2 + i;
    const formula = c.id === "bank_fees" ? `SUMIF(D2:D${n},K${row},G2:G${n})-SUM(F2:F${n})` : `SUMIF(D2:D${n},K${row},G2:G${n})`;
    while (txRows.length <= i + 1) txRows.push(["", "", "", "", "", "", "", "", ""]);
    const r2 = txRows[i + 1];
    while (r2.length < 9) r2.push("");
    r2.push("", c.label, fx(formula));
  });
  add("Bankmutaties", txRows, [11, 11, 34, 22, 13, 12, 14, 13, 50, 2, 24, 14]);

  const agg = {};
  for (const x of f.metaRows) { const a = agg[x.campaign] || (agg[x.campaign] = { spend: 0, clicks: 0, imp: 0, pur: 0, val: 0 }); a.spend += x.spend; a.clicks += x.clicks; a.imp += x.impressions; a.pur += x.purchases; a.val += x.value; }
  const metaRows = [["Campagne", "Markt", "Spend", "Aankopen", "Omzet (Meta)", "ROAS", "Clicks", "CPC", "Impressies", "CPM"]];
  Object.entries(agg).sort((a, b2) => b2[1].spend - a[1].spend).forEach(([c, a], i) => { const row = 2 + i; metaRows.push([c, marketOf(c), nE(a.spend), a.pur, nE(a.val), fx(`IF(C${row}=0,"",E${row}/C${row})`, Z_X), a.clicks, fx(`IF(G${row}=0,"",C${row}/G${row})`), a.imp, fx(`IF(I${row}=0,"",C${row}/I${row}*1000)`)]); });
  const mn = metaRows.length;
  metaRows.push([], ["Totaal", "", fx(`SUM(C2:C${mn})`), fx(`SUM(D2:D${mn})`, "0"), fx(`SUM(E2:E${mn})`), fx(`E${mn + 2}/C${mn + 2}`, Z_X)]);
  add("Meta", metaRows, [44, 11, 13, 10, 14, 9, 9, 9, 12, 9]);

  const inv = [["Handmatige posten"], ["Soort", "Omschrijving", "Bedrag", "Van", "Tot en met"]];
  for (const x of S.manual) inv.push([x.kind === "team_month" ? "Teamkosten per maand" : x.kind === "open_invoice" ? "Open factuur" + (x.paid ? " (betaald)" : "") : MANUAL_KINDS[x.kind] || x.kind, x.label, nE(x.amount), x.from || "", x.to || x.due || ""]);
  inv.push([], ["Standen Shopify en PayPal"], ["Datum", "Payout", "Pending", "Reserve", "PayPal", "Notitie"]);
  for (const x of [...S.balances].sort((a, b2) => a.at.localeCompare(b2.at))) inv.push([x.at, nE(x.payout), nE(x.pending), nE(x.hold), nE(x.paypal), x.note || ""]);
  add("Invoer", inv, [26, 36, 14, 14, 14, 40]);
  return wb;
}
async function exportExcel() {
  const btn = document.getElementById("excel");
  btn.disabled = true; btn.textContent = "Excel maken…";
  try {
    const X = await loadXlsx();
    const wb = buildWorkbook(X);
    const buf = X.write(wb, { bookType: "xlsx", type: "array" });
    const p = P();
    await S.downloads.save({ filename: `ModernoMilano ${p.from} tm ${p.to}.xlsx`, data: new Blob([buf]) });
    toast("Excel opgeslagen");
  } catch (e) {
    const c = e && e.code;
    if (c === "declined") toast("Opslaan geannuleerd");
    else if (c === "rate_limited") toast("Er staat al een opslagvraag open");
    else if (c === "unavailable" || c === "not_granted" || c === "capability_disabled") toast("Bestanden opslaan kan niet in deze weergave");
    else toast("Excel maken mislukt: " + ((e && e.message) || "onbekende fout"));
  } finally { btn.disabled = false; btn.textContent = "Excel"; }
}
document.getElementById("excel").addEventListener("click", exportExcel);

render();
(async () => {
  const cl = window.claude;
  if (!cl || !cl.use) { S.dbState = "niet beschikbaar buiten claude.ai"; S.mcpState = "niet beschikbaar"; S.sales.status = S.meta.status = S.feesLive.status = "fout"; S.sales.err = S.meta.err = "Open deze pagina in claude.ai om je koppelingen te gebruiken."; render(); return; }
  const [db, mcp, downloads] = await Promise.all([cl.use("db"), cl.use("mcp"), cl.use("downloads")]);
  S.db = db; S.mcp = mcp; S.downloads = downloads;
  document.getElementById("excel").hidden = !downloads;
  S.dbState = db ? "ok" : "niet beschikbaar";
  if (db) {
    const onErr = (e) => { S.dbState = e && e.code === "revoked" ? "geen toegang meer" : "fout"; render(); };
    const cfg = (name, apply) => db.doc("config/" + name).onSnapshot((s) => { apply(s.exists ? s.data() : null); S.fc = S.fc && name !== "settings" && name !== "balances" ? S.fc : null; render(); }, onErr);
    cfg("settings", (d) => (S.settings = { ...DEFAULT_SETTINGS, ...(d || {}) }));
    cfg("rules", (d) => (S.rules = d && Array.isArray(d.rules) ? d.rules : null));
    cfg("manual", (d) => (S.manual = (d && d.entries) || []));
    cfg("balances", (d) => (S.balances = (d && d.entries) || []));
    cfg("imports", (d) => (S.imports = (d && d.list) || []));
    cfg("budget", (d) => (S.budget = (d && d.entries) || []));
    db.collection("bank").onSnapshot((q) => { const o = {}; q.docs.forEach((d) => { o[d.id] = (d.data() || {}).txs || []; }); S.bank = o; render(); }, onErr);
    db.collection("fees").onSnapshot((q) => { q.docs.forEach((d) => { S.fees[d.id] = { ...(S.fees[d.id] || {}), ...((d.data() || {}).days || {}) }; }); render(); }, onErr);
  }
  if (!mcp) { S.sales.status = S.meta.status = S.feesLive.status = "fout"; S.sales.err = S.meta.err = S.feesLive.err = mcpMessage({ code: "not_granted" }); render(); return; }
  // eerst de bewaarde fees laten binnenkomen, dan pas ophalen wat ontbreekt
  loadSales(false); loadMeta(false);
  setTimeout(() => loadFees(false), db ? 1500 : 0);
})();
