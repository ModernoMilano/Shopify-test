<script>
"use strict";
/* ============================================================
   Hulpfuncties: datums (Amsterdam), bedragen, tekst
   ============================================================ */
const TZ = "Europe/Amsterdam";
const keyFmt = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });
const dayKey = (d) => keyFmt.format(d);
const addDays = (k, n) => { const [y, m, d] = k.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); };
const eachDay = (a, b) => { const o = []; for (let k = a; k <= b; k = addDays(k, 1)) o.push(k); return o; };
const daysBetween = (a, b) => Math.round((Date.parse(b + "T00:00:00Z") - Date.parse(a + "T00:00:00Z")) / 864e5);
const isWorkday = (k) => { const w = new Date(k + "T00:00:00Z").getUTCDay(); return w >= 1 && w <= 5; };
function tzOffsetMs(at) {
  const p = new Intl.DateTimeFormat("en-US", { timeZone: TZ, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" }).formatToParts(at);
  const g = (t) => Number(p.find((x) => x.type === t).value);
  return Date.UTC(g("year"), g("month") - 1, g("day"), g("hour"), g("minute"), g("second")) - at.getTime();
}
const startOfDayUtc = (k) => { const g = new Date(k + "T00:00:00Z"); return new Date(g.getTime() - tzOffsetMs(g)); };

const eurF = new Intl.NumberFormat("nl-NL", { style: "currency", currency: "EUR" });
const eur0 = new Intl.NumberFormat("nl-NL", { style: "currency", currency: "EUR", maximumFractionDigits: 0, minimumFractionDigits: 0 });
function euro(c, round) {
  if (c === null || c === undefined || !isFinite(c)) return "ontbreekt";
  const v = round ? Math.round(c / 100) : Math.round(c) / 100;
  return (round ? eur0 : eurF).format(v === 0 ? 0 : v);
}
const pct = (v, d = 1) => (v === null || v === undefined || !isFinite(v) ? "ontbreekt" : (v * 100).toFixed(d).replace(".", ",") + "%");
const times = (v) => (v === null || v === undefined || !isFinite(v) ? "ontbreekt" : v.toFixed(2).replace(".", ",") + "x");
const nlDay = new Intl.DateTimeFormat("nl-NL", { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" });
const dayL = (k) => (k ? nlDay.format(new Date(String(k).slice(0, 10) + "T00:00:00Z")).replace(/\./g, "") : "ontbreekt");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const cents = (x) => Math.round(Number(x ?? 0) * 100);
const div = (a, b) => (b === 0 ? null : a / b);
function parseEuroInput(s) {
  const t = String(s ?? "").replace(/[€\s]/g, "");
  if (!t) return null;
  const n = Number(t.includes(",") ? t.replace(/\./g, "").replace(",", ".") : t);
  return isFinite(n) ? Math.round(n * 100) : null;
}
const inEuro = (c) => (c === null || c === undefined ? "" : (c / 100).toFixed(2).replace(".", ","));
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 3200); }
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

/* ============================================================
   Periodes
   ============================================================ */
const PRESETS = [["today", "Vandaag"], ["yesterday", "Gisteren"], ["thisweek", "Deze week"], ["lastweek", "Vorige week"], ["mtd", "Deze maand"], ["lastmonth", "Vorige maand"], ["30d", "Laatste 30 dagen"]];
const mondayOf = (k) => addDays(k, -((new Date(k + "T00:00:00Z").getUTCDay() + 6) % 7));
function resolvePeriod(p) {
  const today = dayKey(new Date());
  if (p.preset === "custom" && p.from && p.to && p.from <= p.to) return { preset: "custom", from: p.from, to: p.to, label: "Eigen periode" };
  let from = today, to = today;
  switch (p.preset) {
    case "yesterday": from = to = addDays(today, -1); break;
    case "thisweek": from = mondayOf(today); break;
    case "lastweek": from = addDays(mondayOf(today), -7); to = addDays(from, 6); break;
    case "mtd": from = today.slice(0, 8) + "01"; break;
    case "lastmonth": to = addDays(today.slice(0, 8) + "01", -1); from = to.slice(0, 8) + "01"; break;
    case "30d": from = addDays(today, -29); break;
    case "today": break;
    default: p.preset = "mtd"; from = today.slice(0, 8) + "01";
  }
  return { preset: p.preset, from, to, label: (PRESETS.find((x) => x[0] === p.preset) || [, ""])[1] };
}

/* ============================================================
   Rekenregels (getest in de repository: src/finance/calculations.ts)
   ============================================================ */
function pnl(i, reserveVat) {
  const costs = i.cogs + i.meta + i.fees + i.chargebacks + i.other + i.team;
  const gross = i.revenue - costs;
  const profit = reserveVat ? gross - i.taxes : gross;
  const nonMeta = costs - i.meta;
  return {
    ...i, costs, profit,
    profitAfterVat: gross - i.taxes,
    profitAfterInventory: profit + (i.inventory || 0),
    margin: div(profit, i.revenue),
    mer: div(i.revenue, i.meta),
    breakEven: i.revenue - nonMeta > 0 ? i.revenue / (i.revenue - nonMeta) : null,
    metaShare: div(i.meta, i.revenue), cogsShare: div(i.cogs, i.revenue),
    aov: i.orders ? Math.round(i.revenue / i.orders) : null,
    profitPerOrder: i.orders ? Math.round(profit / i.orders) : null,
    cogsPerOrder: i.orders ? Math.round(i.cogs / i.orders) : null,
  };
}
function forecast(s) {
  const rows = [];
  let bal = s.bank, payable = 0, schedPaid = false, pendDays = 0;
  const pendPart = s.pendingWorkdays ? s.pending / s.pendingWorkdays : 0;
  for (let i = 1; i <= s.days; i++) {
    const date = addDays(s.start, i - 1), wd = isWorkday(date);
    if (i - s.delay >= 1) payable += s.salesDay * s.ratio;
    let shop = 0;
    if (wd) {
      if (!schedPaid && (!s.payoutDate || date >= s.payoutDate)) { shop += s.payout; schedPaid = true; }
      else if (schedPaid && pendDays < s.pendingWorkdays) { shop += pendPart; pendDays++; }
      shop += payable; payable = 0;
    }
    if (s.releaseAmount && s.releaseDate === date) shop += s.releaseAmount;
    const supplier = s.supplierDay === i ? s.supplier : 0;
    const ps = (s.privateWeek + s.softwareWeek) / 7;
    const extra = s.extraDay || 0;
    bal += shop + s.paypalDay - s.metaDay - supplier - ps - extra;
    rows.push({ day: i, date, wd, shop: Math.round(shop), paypal: Math.round(s.paypalDay), meta: Math.round(s.metaDay), supplier: Math.round(supplier), other: Math.round(ps + extra), bal: Math.round(bal) });
  }
  const lowest = rows.reduce((lo, r) => (r.bal < lo.bal ? r : lo), rows[0] || { bal: s.bank, date: s.start });
  const end = rows.length ? rows[rows.length - 1].bal : s.bank;
  return { rows, lowest, end, after7: (rows[Math.min(6, rows.length - 1)] || { bal: s.bank }).bal, change: end - s.bank, belowBuffer: lowest.bal < s.buffer, belowZero: lowest.bal < 0 };
}
function mergeRanges(ranges) {
  const out = [];
  for (const r of [...ranges].filter((r) => r.from <= r.to).sort((a, b) => a.from.localeCompare(b.from))) {
    const last = out[out.length - 1];
    if (last && r.from <= addDays(last.to, 1)) { if (r.to > last.to) last.to = r.to; } else out.push({ ...r });
  }
  return out;
}

/* ============================================================
   Bank: categorieën, regels, Revolut PDF en CSV
   ============================================================ */
const CATEGORIES = [
  ["shopify_payout", "Inkomsten Shopify", "income"], ["paypal_payout", "Inkomsten PayPal", "income"],
  ["loan", "Lening", "debt"], ["owner_deposit", "Eigen storting", "equity"],
  ["meta", "Meta ads", "cost", "meta"], ["cogs", "COGS en verzending", "cost", "cogs"],
  ["private", "Privé", "private"], ["software", "Software en tools", "cost", "other"],
  ["freelancers", "Freelancers", "cost", "other"], ["accountant", "Boekhouder", "cost", "other"],
  ["bank_fees", "Bankkosten", "cost", "other"], ["other_business", "Overig zakelijk", "cost", "other"],
  ["chargebacks", "Chargebacks en disputes", "cost", "chargebacks"], ["team", "Team", "cost", "team"],
  ["internal", "Interne boeking", "neutral"], ["unknown", "Onbekend", "unknown"],
].map(([id, label, kind, bucket]) => ({ id, label, kind, bucket }));
const CAT = Object.fromEntries(CATEGORIES.map((c) => [c.id, c]));
const KIND_LABEL = { income: "omzet (cash)", cost: "kosten", debt: "schuld, geen omzet", equity: "eigen vermogen", private: "opname, geen kosten", neutral: "telt niet mee", unknown: "toewijzen" };

  <section class="card"><h2>Verdeling</h2>
    ${m.total > 0 ? `<div class="costbar" style="height:38px">${parts.filter((x) => x[2] > 0).map((x) => `<div class="${x[5] ? "hatch" : ""}" title="${esc(x[1])}: ${euro(x[2])}" style="width:${(x[2] / m.total) * 100}%;background-color:${x[4]}"></div>`).join("")}</div>` : ""}
    <div class="scroll" style="margin-top:12px"><table><thead><tr><th>Plek</th><th class="r">Bedrag</th><th class="r">Aandeel</th><th>Beschikbaar</th></tr></thead><tbody>

function viewMeta() {
  const f = finance(P()), s = S.settings;
  const aggr = (keyFn) => {
    const m = {};
    for (const r of f.metaRows) { const k = keyFn(r); const a = m[k] || (m[k] = { k, spend: 0, clicks: 0, imp: 0, pur: 0, val: 0, fw: 0 }); a.spend += r.spend; a.clicks += r.clicks; a.imp += r.impressions; a.pur += r.purchases; a.val += r.value; a.fw += (r.freq || 0) * r.impressions; }
    return Object.values(m).sort((a, b) => b.spend - a.spend);
  };
  const table = (rows, label) => `<div class="scroll"><table><thead><tr><th>${label}</th><th class="r">Spend</th><th class="r">Aankopen</th><th class="r">Omzet (Meta)</th><th class="r">ROAS</th><th class="r">CPC</th><th class="r">CPM</th><th class="r">Frequency</th></tr></thead><tbody>
    ${rows.map((a) => { const roas = div(a.val, a.spend), fr = a.imp ? a.fw / a.imp : null; return `<tr><td style="max-width:18rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(a.k)}">${esc(a.k)}</td><td class="r">${euro(a.spend, true)}</td><td class="r">${a.pur}</td><td class="r">${euro(a.val, true)}</td><td class="r ${roas !== null && roas < s.breakEven ? "neg" : "good"}"><b>${times(roas)}</b></td><td class="r">${a.clicks ? euro(Math.round(a.spend / a.clicks)) : "ontbreekt"}</td><td class="r">${a.imp ? euro(Math.round((a.spend / a.imp) * 1000)) : "ontbreekt"}</td><td class="r ${fr !== null && fr >= 2.5 ? "warn" : ""}">${fr === null ? "" : fr.toFixed(2).replace(".", ",")}</td></tr>`; }).join("") || `<tr><td colspan="8" class="empty">${S.meta.status === "laden" ? "Laden…" : S.meta.status === "fout" ? esc(S.meta.err) : "Geen Meta-data in deze periode."}</td></tr>`}
  </tbody></table></div>`;
  const value = f.metaRows.reduce((a, r) => a + r.value, 0), spend = f.metaSpend || 0;
  const bl = [...S.budget].sort((a, b) => a.date.localeCompare(b.date));
  const warnFor = (c, i) => {
    const w = [];
    if (c.old > 0 && (c.nw - c.old) / c.old > 0.2) w.push(`Verhoging van ${Math.round(((c.nw - c.old) / c.old) * 100)}%, meer dan 20%`);
    const prev = bl.slice(0, i).reverse().find((x) => x.campaign === c.campaign);
    if (prev && daysBetween(prev.date, c.date) < 3) w.push(`Maar ${daysBetween(prev.date, c.date)} dag(en) na de vorige ingreep, minimaal 3`);
    if (bl.some((x) => x !== c && x.date === c.date)) w.push("Meerdere ingrepen op dezelfde dag");
    return w;
  };
  return `
  <section><h1 class="serif" style="font-size:28px">Meta ads</h1><p class="sub">Live uit Windsor.ai. Break-even afspraak ${times(s.breakEven)}, rood is eronder.</p></section>
  <section class="grid kpis">${kpi("Spend", euro(spend, true), badge(S.meta.status === "ok" ? "Meta" : "ontbreekt"))}${kpi("Betaald (bank)", euro(f.metaPaid, true), "loopt achter op spend")}${kpi("Omzet volgens Meta", euro(value, true), "ROAS " + times(div(value, spend)))}${kpi("Omzet Shopify", euro(f.res.revenue, true), "MER " + times(div(f.res.revenue, spend)), spend && f.res.revenue / spend < s.breakEven ? "neg" : "")}${kpi("Meta %", pct(div(spend, f.res.revenue)), "spend / omzet")}${kpi("Break-even", times(f.res.breakEven), "berekend, afspraak " + times(s.breakEven))}</section>
  <section class="card"><h2>Per campagne</h2>${table(aggr((r) => r.campaign), "Campagne")}<p class="muted" style="font-size:12px;margin:8px 0 0">CPC = spend / clicks. Frequency oranje vanaf 2,5: tijd voor nieuwe creatives.</p></section>
  <section class="card"><h2>Per markt</h2>${table(aggr((r) => marketOf(r.campaign)), "Markt")}</section>
  <section class="card"><h2>Budgetwijzigingen</h2><p class="dim" style="margin:0 0 10px">Protocol: max 20% per ingreep, minimaal 3 tot 4 dagen ertussen, nooit twee ingrepen tegelijk.</p>
    <form data-form="budget" class="row"><input class="input" type="date" id="b_date" value="${dayKey(new Date())}" required><input class="input" id="b_campaign" list="campaigns" placeholder="Campagne" required style="width:240px"><datalist id="campaigns">${[...new Set(S.meta.rows.map((r) => r.campaign))].map((c) => `<option value="${esc(c)}">`).join("")}</datalist><input class="input" id="b_old" placeholder="oud budget" inputmode="decimal" required style="width:110px"><input class="input" id="b_new" placeholder="nieuw budget" inputmode="decimal" required style="width:110px"><button class="btn" type="submit">Toevoegen</button></form>
    <div class="scroll" style="margin-top:10px"><table><tbody>${bl.map((c, i) => ({ c, w: warnFor(c, i) })).reverse().map(({ c, w }) => `<tr><td style="white-space:nowrap">${dayL(c.date)}</td><td>${esc(c.campaign)}</td><td class="r">${euro(c.old)} naar ${euro(c.nw)}</td><td>${w.map((x) => `<div class="neg" style="font-size:12px">${esc(x)}</div>`).join("")}</td><td class="r"><button class="btn ghost" style="padding:2px 8px" type="button" data-act="delBudget" data-id="${c.id}">verwijder</button></td></tr>`).join("") || '<tr><td class="muted">Nog geen wijzigingen gelogd.</td></tr>'}</tbody></table></div>
  </section>`;
}

function viewBank() {
  const p = P(), fl = S.bankFilter;

/* ============================================================
   Vraag het: Claude beantwoordt vragen over de cijfers van dit dashboard.
   Claude rekent niet zelf uit het hoofd maar roept de rekenfuncties van deze pagina aan (tools).

const eurN = (c) => (c === null || c === undefined || !isFinite(c) ? null : Math.round(c) / 100);
const isDay = (k) => /^\d{4}-\d{2}-\d{2}$/.test(String(k || ""));
function aiFinance(from, to) {
  if (!isDay(from) || !isDay(to) || from > to) throw new Error("gebruik from en to als YYYY-MM-DD, from voor to");
  const f = finance({ from, to }), r = f.res, cov = coverage();
  return {
    periode: { van: from, tot_en_met: to }, bedragen_in: "euro",
    omzet_incl_btw: eurN(r.revenue), btw_in_omzet: eurN(r.taxes), orders: r.orders,
    kosten: Object.fromEntries(f.lines.filter((l) => l.key !== "revenue").map((l) => [l.label, { bedrag: eurN(l.v), bron: l.src.join(", "), toelichting: l.note || undefined }])),
    winst: eurN(r.profit), marge: r.margin, mer: r.mer, break_even_roas: r.breakEven, aov: eurN(r.aov), winst_per_order: eurN(r.profitPerOrder),
    btw_gereserveerd_in_winst: S.settings.reserveVat,
    datagaten: { dagen_zonder_omzetdata: f.missingSales, bank_gedekt_tot: cov.last, meta_geladen_vanaf: S.meta.rows.length ? S.meta.rows.reduce((a, x) => (x.date < a ? x.date : a), "9999") : null },
  };
}
function aiDaily(from, to) {
  if (!isDay(from) || !isDay(to) || from > to) throw new Error("gebruik from en to als YYYY-MM-DD");
  const days = eachDay(from, to).slice(-120), pd = ppOk() ? ppDays() : {};
  return days.map((k) => {
    const s = S.sales.byDay[k], fd = feeDay(k), meta = S.meta.rows.filter((x) => x.date === k).reduce((a, x) => a + x.spend, 0);
    return { dag: k, omzet: s ? eurN(s.total) : null, orders: s ? s.orders : null, meta_spend: S.meta.status === "ok" ? eurN(meta) : null, fees_shopify: fd ? eurN(fd.f) : null, fees_paypal: pd[k] ? eurN(pd[k].f) : ppOk() ? 0 : null };
  });
}
/* Winstprognose: omzet, Meta en fees uit de laatste basisdagen, COGS en chargebacks als percentage van de omzet en
   vaste kosten per dag uit de laatste 30 dagen die de bank dekt. Deterministisch, zodat het antwoord klopt. */
function aiProjection({ days, basisDays = 14, revenueChangePct = 0, metaChangePct = 0 }) {
  days = Math.round(Number(days)); basisDays = Math.round(Number(basisDays) || 14);
  if (!(days >= 1 && days <= 365)) throw new Error("days moet tussen 1 en 365 liggen");
  if (!(basisDays >= 3 && basisDays <= 90)) throw new Error("basisDays moet tussen 3 en 90 liggen");
  const today = dayKey(new Date()), bTo = addDays(today, -1), bFrom = addDays(bTo, -(basisDays - 1));
  const live = finance({ from: bFrom, to: bTo }).res;
  const cov = coverage(), cTo = cov.last && cov.last < bTo ? cov.last : bTo, cFrom = addDays(cTo, -29);
  const cost = cov.last ? finance({ from: cFrom, to: cTo }).res : null;
  if (!live.revenue) throw new Error("geen omzet in de basisperiode");
  // delen door de dagen waarvoor echt omzetdata is, zodat een ontbrekende dag het gemiddelde niet omlaag trekt
  const n = eachDay(bFrom, bTo).filter((k) => S.sales.byDay[k]).length || basisDays;
  const rev = (live.revenue / n) * (1 + Number(revenueChangePct || 0) / 100);
  const meta = (live.meta / n) * (1 + Number(metaChangePct || 0) / 100);
  const ratio = (x, base) => (base && base.revenue ? x / base.revenue : null);
  const cogsR = cost ? ratio(cost.cogs, cost) : null, cbR = cost ? ratio(cost.chargebacks, cost) : ratio(live.chargebacks, live), feeR = ratio(live.fees, live), taxR = ratio(live.taxes, live);
  const otherD = cost ? cost.other / 30 : null, teamD = cost ? cost.team / 30 : null;
  const R = rev * days;
  const p = { omzet: R, cogs: cogsR === null ? null : R * cogsR, meta: meta * days, fees: R * feeR, chargebacks: R * (cbR || 0), overig: otherD === null ? null : otherD * days, team: teamD === null ? null : teamD * days };
  const costs = p.cogs + p.meta + p.fees + p.chargebacks + p.overig + p.team;
  const profit = p.cogs === null || p.overig === null ? null : R - costs - (S.settings.reserveVat ? R * taxR : 0);
  return {
    dagen: days, vanaf: today, tot_en_met: addDays(today, days - 1), bedragen_in: "euro",
    aannames: {
      basis_omzet_meta_fees: `${bFrom} t/m ${bTo} (${basisDays} dagen)`, omzet_per_dag: eurN(rev), orders_per_dag: Math.round((live.orders / n) * 10) / 10, dagen_met_omzetdata: n, meta_per_dag: eurN(meta),
      basis_cogs_en_vaste_kosten: cost ? `${cFrom} t/m ${cTo} (laatste 30 dagen bank)` : "ontbreekt, geen bankafschrift",
      cogs_pct_van_omzet: cogsR, fees_pct_van_omzet: feeR, chargebacks_pct_van_omzet: cbR, overig_per_dag: eurN(otherD), team_per_dag: eurN(teamD),
      omzet_aanpassing_pct: Number(revenueChangePct || 0), meta_aanpassing_pct: Number(metaChangePct || 0), btw_gereserveerd: S.settings.reserveVat,
    },
    prognose: Object.fromEntries(Object.entries(p).map(([k, v]) => [k, eurN(v)])),
    winst: eurN(profit), winst_per_dag: profit === null ? null : eurN(profit / days), marge: profit === null ? null : profit / R, mer: meta ? rev / meta : null,
  };
}
function aiMoney() {
  const m = moneyNow(), p = m.pos, cov = coverage();
  return {
    bedragen_in: "euro", bank: eurN(p.bank), bank_saldo_tot: m.bankDate, onderweg_naar_bank: eurN(p.transit), paypal: eurN(p.paypal), paypal_vastgehouden: eurN(p.ppLocked),
    shopify_payout_ingepland: eurN(p.payout), shopify_payout_datum: m.payoutDate, shopify_pending: eurN(p.pending), shopify_reserve: eurN(p.hold),
    direct_beschikbaar: eurN(m.now), binnenkort: eurN(m.soon), op_slot: eurN(m.locked), totaal: eurN(m.total),
    bron_shopify: m.shopSrc, bron_paypal: m.ppSrc, bank_ontbreekt_vanaf: cov.missingFrom,
    open_disputes_shopify: S.disputes.list.filter((x) => !["WON", "LOST", "ACCEPTED", "CHARGE_REFUNDED"].includes(x.status)).map((x) => ({ order: x.name, bedrag: eurN(x.amount), status: x.status })),
  };
}
function aiCash(days) {
  days = Math.round(Number(days) || 14);
  if (!(days >= 1 && days <= 60)) throw new Error("days moet tussen 1 en 60 liggen");
  const fc = forecast({ ...fcSettings(), days });
  return { bedragen_in: "euro", start_bank_incl_onderweg: eurN(fcSettings().bank), buffer: eurN(S.settings.buffer), laagste: { dag: fc.lowest.date, saldo: eurN(fc.lowest.bal) }, eind: eurN(fc.end), onder_buffer: fc.belowBuffer, onder_nul: fc.belowZero, per_dag: fc.rows.map((r) => ({ dag: r.date, shopify: eurN(r.shop), paypal: eurN(r.paypal), meta: eurN(-r.meta), leverancier: eurN(-r.supplier), overig: eurN(-r.other), saldo: eurN(r.bal) })), aannames: { verkoop_per_dag: eurN(S.settings.salesDay), meta_per_dag: eurN(S.settings.metaDay), paypal_per_dag: eurN(S.settings.paypalDay) } };
}
const DAY_SCHEMA = { type: "object", properties: { from: { type: "string", description: "YYYY-MM-DD" }, to: { type: "string", description: "YYYY-MM-DD, tot en met" } }, required: ["from", "to"] };

async function askClaude(question) {
  const c = S.chat;
  if (!S.sample || c.busy || !question.trim()) return;
  if (S.perms) {
    const st = await S.perms.state("sample").catch(() => null);
    if (st === "prompt") S.permState.sample = (await S.perms.request(["sample"]).catch(() => ({}))).sample;
  }
  c.msgs.push({ role: "user", content: question.trim() });
  c.busy = true; c.pending = ""; c.status = "Denkt na…"; c.error = null; c.ctl = new AbortController();

  if (document.activeElement && document.activeElement.id === "askInput") document.activeElement.blur();
  render(); scrollChat();
  const caps = await S.sample.limits().catch(() => null);
  const useTools = !!(caps && caps.tools);
  const turns = c.msgs.slice(-12).map((m) => ({ role: m.role, content: m.content }));
  if (turns[0].role !== "user") turns.shift();
  const tools = useTools ? AI_TOOLS.map((t) => ({ ...t, execute: (i, ctx) => { c.status = (TOOL_LABEL[t.name] || t.name) + "…"; updateChatLive(); return t.execute(i || {}, ctx); } })) : undefined;
  try {
    const { text, truncated } = await S.sample([{ role: "user", content: aiRules() + (useTools ? "" : aiContextNoTools()) }, ...turns], {
      cache: false, signal: c.ctl.signal, tools,
      onText: ({ text }) => { c.pending = text; c.status = ""; updateChatLive(); },
    });
    c.msgs.push({ role: "assistant", content: text + (truncated ? "\n\n(Antwoord afgekapt, vraag iets kleiners.)" : "") });
  } catch (e) {
    if (e && e.text && e.code !== "refused") c.msgs.push({ role: "assistant", content: e.text + "\n\n(onderbroken)" });
    // geen antwoord: de vraag terugzetten in het invoerveld in plaats van hem dubbel in het gesprek te laten staan
    else if (c.msgs.length && c.msgs[c.msgs.length - 1].role === "user") c.retry = c.msgs.pop().content;
    c.consent = !!(e && needsConsent(e));
    if (!e || e.code !== "cancelled") c.error = sampleMessage(e) + ` (${(e && e.code) || "onbekend"}${e && e.message ? ": " + String(e.message).slice(0, 160) : ""})`;
    if (e && ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e.code)) c.off = true;

    c.busy = false; c.pending = ""; c.status = ""; c.ctl = null;
    try { store.set("mm.chat", c.msgs.slice(-20)); } catch {}
    render(); scrollChat();
    const inp = document.getElementById("askInput"); if (inp && !c.off) { if (c.retry) { inp.value = c.retry; c.retry = null; } inp.focus(); }
  }
}
function sampleMessage(e) {
  switch (e && e.code) {
    case "not_granted": return "Je hebt deze pagina geen toestemming gegeven om Claude te gebruiken. Herlaad de pagina om het opnieuw te proberen.";
    case "sampling_disabled": return "Claude is niet beschikbaar voor je account.";
    case "rate_limited": return "Te veel vragen of je Claude-tegoed is op. Probeer het straks opnieuw.";
    case "session_expired": return "Log opnieuw in bij claude.ai.";
    case "prompt_too_large": return "Het gesprek is te lang geworden. Klik op Nieuw gesprek.";
    case "refused": return "Claude kon deze vraag niet beantwoorden. Stel hem anders.";
    default: return "Er ging iets mis. Probeer het opnieuw.";
  }
}
function mdLite(s) {
  const lines = esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").split("\n");
  let out = "", inList = false;
  for (const l of lines) {
    const m = l.match(/^\s*[-*•]\s+(.*)/), h = l.match(/^#{1,4}\s+(.*)/);
    if (m) { if (!inList) { out += "<ul>"; inList = true; } out += `<li>${m[1]}</li>`; continue; }
    if (inList) { out += "</ul>"; inList = false; }
    out += h ? `<p><b>${h[1]}</b></p>` : l.trim() ? `<p>${l}</p>` : "";
  }
  return out + (inList ? "</ul>" : "");
}

/* ============================================================
   Winstprognose: omzet, kosten en winst vooruit, met scenario's voor het Meta-budget.
   Basis: omzet, Meta, fees en btw uit de laatste basisdagen; COGS, chargebacks en vaste kosten uit de laatste
   30 dagen bank (zonder bank: de aanname voor COGS en de software per week). Meer Meta geeft minder dan

    bFrom, bTo, n, revD: live.revenue / n, metaD: live.meta / n, ordersD: live.orders / n,

    cbR: okCost ? cost.chargebacks / cost.revenue : live.chargebacks / live.revenue,
    feeR: live.fees > 0 ? live.fees / live.revenue : 0.03, feeSrc: live.fees > 0 ? "Shopify en PayPal" : "aanname 3%",
    taxR: live.taxes / live.revenue,

function pfDay(b, o, i) {

  const rev = b.revD * ((1 - o.paidShare) + o.paidShare * Math.pow(ratio, o.elast)) * g;
  const meta = b.metaD * ratio;
  const cogs = rev * b.cogsR, fees = rev * b.feeR, cb = rev * b.cbR, vat = S.settings.reserveVat ? rev * b.taxR : 0;
  const profit = rev - cogs - meta - fees - cb - b.otherD - b.teamD - vat;

}
function pfRun(b, o, start, days) {

  for (let i = 0; i < days; i++) { const d = { date: addDays(start, i), ...pfDay(b, o, i) }; rows.push(d); for (const k of Object.keys(tot)) tot[k] += d[k]; }

/* Het Meta-budget per dag waarbij de winst het hoogst is, binnen dit model. */

const fmtAxis = (v, f) => (f === "x" ? v.toFixed(1).replace(".", ",") + "x" : eur0.format(v / 100));
function niceStep(range) { const raw = range / 4 || 1, mag = 10 ** Math.floor(Math.log10(raw)), n = raw / mag; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag; }
function drawLine(el, spec) {
  const W = Math.max(280, el.clientWidth), H = 230, PL = spec.fmt === "x" ? 44 : 64, PR = 10, PT = 12, PB = 24;
  const all = spec.series.flatMap((s) => s.values.filter((v) => v !== null && isFinite(v)));
  if (spec.ref) all.push(spec.ref.v); if (spec.zero) all.push(0);
  if (!all.length) { el.innerHTML = '<p class="muted" style="padding:40px 0;text-align:center">Nog geen data.</p>'; return; }
  const max = Math.max(...all, 0), min = Math.min(...all, 0), step = niceStep(max - min), top = Math.ceil(max / step) * step || step, bot = Math.floor(min / step) * step;

  const x = (i) => PL + (n <= 1 ? iw / 2 : (i / (n - 1)) * iw), y = (v) => PT + ((top - v) / (top - bot || 1)) * ih;
  const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 80))));
  let g = "";
  for (let v = bot; v <= top + step / 2; v += step) g += `<line x1="${PL}" x2="${W - PR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${PL - 7}" y="${y(v)}" dy="0.32em" text-anchor="end" font-size="11" fill="var(--text-3)">${fmtAxis(v, spec.fmt)}</text>`;
  if (spec.zero) g += `<line x1="${PL}" x2="${W - PR}" y1="${y(0)}" y2="${y(0)}" stroke="var(--neg)" stroke-dasharray="4 4" stroke-width="1.5"/>`;
  if (spec.ref) g += `<line x1="${PL}" x2="${W - PR}" y1="${y(spec.ref.v)}" y2="${y(spec.ref.v)}" stroke="var(--text-3)" stroke-dasharray="4 4"/><text x="${W - PR}" y="${y(spec.ref.v) - 5}" text-anchor="end" font-size="11" fill="var(--text-2)">${esc(spec.ref.label)}</text>`;
  spec.dates.forEach((d, i) => { if (i % every === 0) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--text-3)">${dayL(d)}</text>`; });
  for (const s of spec.series) {
    let d = ""; s.values.forEach((v, i) => { if (v === null || !isFinite(v)) return; d += (d && s.values[i - 1] !== null ? "L" : "M") + x(i).toFixed(1) + "," + y(v).toFixed(1); });
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.dashed ? 'stroke-dasharray="5 4"' : ""}/>`;
  }
  const legend = spec.series.length > 1 ? `<div class="chartlegend">${spec.series.map((s) => `<span><i style="background:${s.color}"></i>${esc(s.label)}</span>`).join("")}</div>` : "";
  el.innerHTML = `${legend}<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(spec.series.map((s) => s.label).join(", "))}">${g}<g class="hov"></g><rect x="${PL}" y="${PT}" width="${iw}" height="${ih}" fill="transparent"/></svg><div class="tip" hidden></div>`;
  const svg = el.querySelector("svg"), hov = el.querySelector(".hov"), tip = el.querySelector(".tip");
  const fv = (v) => (v === null || !isFinite(v) ? "ontbreekt" : spec.fmt === "x" ? times(v) : euro(v, true));

    const r = svg.getBoundingClientRect(), px = ((ev.clientX - r.left) / r.width) * W;
    const i = Math.max(0, Math.min(n - 1, Math.round(((px - PL) / iw) * (n - 1))));
    hov.innerHTML = `<line x1="${x(i)}" x2="${x(i)}" y1="${PT}" y2="${H - PB}" stroke="var(--text-3)"/>` + spec.series.map((s) => (s.values[i] === null || !isFinite(s.values[i]) ? "" : `<circle cx="${x(i)}" cy="${y(s.values[i])}" r="4.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`)).join("");
    tip.hidden = false;
    tip.innerHTML = `<b>${dayL(spec.dates[i])}</b>` + spec.series.map((s) => `<div><span class="dim">${esc(s.label)}</span><span class="num">${fv(s.values[i])}</span></div>`).join("");
    tip.style.left = Math.min(Math.max((x(i) / W) * 100 - 12, 0), 60) + "%";
  });
  svg.addEventListener("pointerleave", () => { hov.innerHTML = ""; tip.hidden = true; });
}
function drawWaterfall(el, spec) {
  const W = Math.max(320, el.clientWidth), H = 290, PT = 26, PB = 58, PX = 6;
  const all = [...spec.steps, { key: "end", label: spec.end, v: spec.steps.reduce((a, s) => a + s.v, 0) }];
  let run = 0;
  const bars = all.map((s, i) => { const end = i === all.length - 1; const st = end || i === 0 ? 0 : run; const en = end ? s.v : i === 0 ? s.v : run + s.v; if (!end) run = i === 0 ? s.v : run + s.v; return { ...s, st, en, end, first: i === 0 }; });

  bars.forEach((b, i) => {
    const bx = PX + i * slot + (slot - bw) / 2, t = y(Math.max(b.st, b.en)), h = Math.max(1, Math.abs(y(b.st) - y(b.en)));
    const col = b.first ? "var(--c-profit)" : b.end ? "var(--text)" : b.v >= 0 ? "var(--good)" : "var(--neg)";
    g += `<rect x="${bx}" y="${t}" width="${bw}" height="${h}" rx="3" fill="${col}" opacity="${b.first || b.end ? 1 : 0.85}"/>`;
    if (i < bars.length - 1) g += `<line x1="${bx + bw}" x2="${bx + slot}" y1="${y(b.en)}" y2="${y(b.en)}" stroke="var(--text-3)" stroke-dasharray="2 3"/>`;
    g += `<text x="${bx + bw / 2}" y="${t - 6}" text-anchor="middle" font-size="${W < 520 ? 10 : 12}" font-weight="500" fill="var(--text)">${b.v > 0 && !b.first && !b.end ? "+" : ""}${euro(b.v, true)}</text>`;
    g += `<foreignObject x="${PX + i * slot}" y="${H - PB + 8}" width="${slot}" height="${PB}"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:${W < 520 ? 10 : 11.5}px;line-height:1.2;text-align:center;color:var(--text-2);padding:0 2px">${esc(b.label)}</div></foreignObject>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Van winst naar bankrekening">${g}</svg>`;
}

async function importFiles(files) {
  files = files.filter((f) => /\.(pdf|csv)$/i.test(f.name) || /pdf|csv/.test(f.type));
  if (!files.length) { toast("Alleen PDF- of CSV-afschriften van Revolut kunnen worden ingelezen"); return; }
  if (S.importing) { toast("Even wachten, er wordt al een afschrift ingelezen"); return; }
  S.importing = true; render(); toast("Afschrift inlezen…");
  try { await importFilesInner(files); } finally { S.importing = false; render(); }
}
async function importFilesInner(files) {
  const results = [];
  const rs = rules();
  for (const file of files) {
    try {
      const isPdf = /\.pdf$/i.test(file.name) || file.type === "application/pdf";
      const st = isPdf ? await parseRevolutPdf(await file.arrayBuffer()) : parseRevolutCsv(await file.text());
      const rec = reconcile(st);
      const seen = {};
      const txs = st.txs.map((t, i) => {
        const base = [t.d, t.a, t.b ?? "", t.ds].join("|"); const occ = seen[base] || 0; seen[base] = occ + 1;
        const r = matchRule(t, rs);
        return { k: base + "|" + occ, d: t.d, ds: t.ds, dt: t.dt, a: t.a, f: t.f || 0, b: t.b ?? null, c: r ? r.category : "unknown", cs: "regel", i };
      });
      const byMonth = {};
      for (const t of txs) (byMonth[t.d.slice(0, 7)] = byMonth[t.d.slice(0, 7)] || []).push(t);
      let added = 0;
      for (const [m, list] of Object.entries(byMonth)) {
        await writeDoc(`bank/${m}`, (cur) => {
          const have = (cur && cur.txs) || [];
          const keys = new Set(have.map((t) => t.k));
          const fresh = list.filter((t) => !keys.has(t.k));
          added += fresh.length;
          if (!fresh.length) return null;
          const merged = [...have, ...fresh].sort((a, b) => a.d.localeCompare(b.d) || (a.i || 0) - (b.i || 0));
          return { txs: merged };
        });
      }
      const info = { file: file.name, from: st.from, to: st.to, n: txs.length, added, dup: txs.length - added, ok: rec.ok, opening: rec.opening, closing: rec.closing, unknown: txs.filter((t) => t.c === "unknown").length, at: new Date().toISOString() };
      results.push(info);
      await writeDoc("config/imports", (cur) => ({ list: [...((cur && cur.list) || []), { file: info.file, from: info.from, to: info.to, n: info.n, ok: info.ok, at: info.at }].slice(-200) }));
    } catch (e) { results.push({ file: file.name, error: e && e.message ? e.message : String(e) }); }
  }
  S.lastImport = results;
  const ok = results.filter((x) => !x.error);
  if (ok.length) toast(`${ok.reduce((a, x) => a + x.added, 0)} nieuwe mutaties ingelezen`);
}
async function recategorize(newRules) {
  for (const m of Object.keys(S.bank)) {
    await writeDoc(`bank/${m}`, (cur) => {
      if (!cur) return null;
      let changed = false;
      const txs = cur.txs.map((t) => { if (t.cs === "handmatig") return t; const r = matchRule(t, newRules); const c = r ? r.category : "unknown"; if (c !== t.c) { changed = true; return { ...t, c }; } return t; });

}

function loadXlsx() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    sc.onload = () => res(window.XLSX);
    sc.onerror = () => rej(new Error("De Excel-module kon niet laden. Probeer het opnieuw."));
    document.head.appendChild(sc);
  });
}
const Z_EUR = '€ #,##0.00;[Red]-€ #,##0.00', Z_PCT = "0.0%", Z_X = '0.00"x"';
const nE = (c) => (c === null || c === undefined ? "" : { t: "n", v: Math.round(c) / 100, z: Z_EUR });
const fx = (f, z = Z_EUR) => ({ t: "n", f, z });
function buildWorkbook(X) {

  const src = (key) => (f.lines.find((l) => l.key === key) || { src: [] }).src.join(", ");

    ["Software, freelancers, boekhouder, bank", nE(r.other), fx("B9/$B$4", Z_PCT), src("other")],
    ["Teamkosten", nE(r.team), fx("B10/$B$4", Z_PCT), src("team")],
    ["Btw gereserveerd", nE(S.settings.reserveVat ? r.taxes : 0), fx("B11/$B$4", Z_PCT), S.settings.reserveVat ? "instelling aan" : "instelling uit (btw fix)"],
    ["Winst", fx("B4-SUM(B5:B11)"), fx("B12/$B$4", Z_PCT)],
    [],
    ["Marge", fx("B12/B4", Z_PCT)],
    ["MER (omzet / Meta)", fx("B4/B6", Z_X)],
    ["Break-even ROAS", fx("B4/(B4-(B5+B7+B8+B9+B10))", Z_X)],
    ["Break-even afspraak", { t: "n", v: S.settings.breakEven, z: Z_X }],

    ["Btw in de omzet", nE(r.taxes)],

  add("Geld", [
    title, [],
    ["Plek", "Bedrag", "Beschikbaar"],
    ["Bank (Revolut)", nE(m.pos.bank), "nu"],
    ["Onderweg naar bank", nE(m.pos.transit), "na het laatste afschrift uitbetaald"],
    ["PayPal", nE(m.pos.paypal), "nu"],
    ["PayPal vastgehouden", nE(m.pos.ppLocked), "op slot"],

    ["Shopify pending", nE(m.pos.pending), "komende werkdagen"],

    [],
    ["Direct beschikbaar", fx("B4+B6")],
    ["Binnenkort", fx("B5+B8+B9")],
    ["Op slot", fx("B7+B10")],
    [],
    ["Bron PayPal", m.ppSrc === "PayPal" ? "uit PayPal" : m.ppSrc],
    ["Bron Shopify", m.shopSrc === "berekend" ? `berekend: uitbetaling na ${S.settings.payoutDelay} werkdagen, reserve ${Math.round(S.settings.shopReservePct * 1000) / 10}% voor ${S.settings.shopReserveDays} dagen` : m.shopSrc],
    ["Bank volgens afschrift t/m", m.bankDate || "ontbreekt"],
  ], [30, 16, 24]);

  const priv = b.steps.find((x) => x.key === "priv").v, loans = b.steps.find((x) => x.key === "loans").v;
  add("Winst naar bank", [
    title, [],
    ["Stap", "Bedrag", "Uitleg"],
    ["Winst", fx("Overzicht!B12"), "uit het tabblad Overzicht"],
    ["Shopify-saldo begin", nE(b.shopBegin), "payout + pending + reserve, berekend"],

    ["PayPal-saldo begin", nE(b.ppBegin), "incl. vastgehouden"],

    ["Naar privé", nE(priv), "opnames, geen kosten"],
    ["Meta verbruikt", fx("Overzicht!B6"), ""],
    ["Meta betaald via bank en PayPal", fx("Overzicht!B23"), ""],
    ["Meta verbruikt min betaald", fx("B12-B13"), ""],
    ["Lening en stortingen", nE(loans), "geen omzet, wel geld op de bank"],
    ["Banksaldo begin", nE(b.bankBegin), ""],
    ["Banksaldo eind", nE(b.bankEnd), "t/m " + b.end],
    ["Groei bankrekening", fx("B17-B16"), ""],
    ["Timing en afronding", fx("B18-(B4+B7+B10+B11+B14+B15)"), "wat de stappen niet verklaren"],
    ["Controle (moet 0 zijn)", fx("B4+B7+B10+B11+B14+B15+B19-B18"), ""],
  ], [30, 16, 38]);

  const fs = S.fc || fcSettings(), fc = forecast(fs);
  const fcRows = [["Prognose vanaf " + fs.start, "", "", "", "", "", "", ""], [], ["Datum", "Werkdag", "Shopify in", "PayPal in", "Meta", "Leverancier", "Privé en software", "Saldo"], ["Nu", "", "", "", "", "", "", nE(fs.bank)]];
  fc.rows.forEach((x, i) => { const row = 5 + i; fcRows.push([x.date, x.wd ? "ja" : "nee", nE(x.shop), nE(x.paypal), nE(x.meta), nE(x.supplier), nE(x.other), fx(`H${row - 1}+C${row}+D${row}-E${row}-F${row}-G${row}`)]); });
  const last = 4 + fc.rows.length;
  fcRows.push([], ["Laagste saldo", "", "", "", "", "", "", fx(`MIN(H5:H${last})`)], ["Buffer", "", "", "", "", "", "", nE(fs.buffer)], ["Onder buffer?", "", "", "", "", "", "", { t: "s", f: `IF(H${last + 2}<H${last + 3},"ja","nee")` }]);
  add("Prognose", fcRows, [14, 9, 13, 12, 12, 13, 17, 14]);

  const txs = allTxs().filter((t) => { const e = t.pd || t.d; return e >= p.from && e <= p.to; });
  const txRows = [["Datum", "Hoort bij", "Omschrijving", "Categorie", "Bedrag", "Waarvan transferkosten", "Bedrag excl. kosten", "Saldo", "Details"]];
  txs.forEach((t, i) => { const row = 2 + i; txRows.push([t.d, t.pd || t.d, t.ds, CAT[t.c] ? CAT[t.c].label : t.c, nE(t.a), nE(t.f || 0), fx(`E${row}+F${row}`), nE(t.b), String(t.dt || "").replace(/\n/g, ", ")]); });
  const n = txs.length + 1;
  txRows[0].push("", "Categorie", "Totaal");
  CATEGORIES.forEach((c, i) => {
    const row = 2 + i;

    while (txRows.length <= i + 1) txRows.push(["", "", "", "", "", "", "", "", ""]);

  const metaRows = [["Campagne", "Markt", "Spend", "Aankopen", "Omzet (Meta)", "ROAS", "Clicks", "CPC", "Impressies", "CPM"]];
  Object.entries(agg).sort((a, b2) => b2[1].spend - a[1].spend).forEach(([c, a], i) => { const row = 2 + i; metaRows.push([c, marketOf(c), nE(a.spend), a.pur, nE(a.val), fx(`IF(C${row}=0,"",E${row}/C${row})`, Z_X), a.clicks, fx(`IF(G${row}=0,"",C${row}/G${row})`), a.imp, fx(`IF(I${row}=0,"",C${row}/I${row}*1000)`)]); });

async function exportExcel() {
  const btn = document.getElementById("excel");
  btn.disabled = true; btn.textContent = "Excel maken…";
  try {
    const X = await loadXlsx();
    const wb = buildWorkbook(X);
    const buf = X.write(wb, { bookType: "xlsx", type: "array" });
    const p = P();
    await S.downloads.save({ filename: `ModernoMilano ${p.from} tm ${p.to}.xlsx`, data: new Blob([buf]) });
    toast("Excel opgeslagen");
  } catch (e) {
    const c = e && e.code;
    if (c === "declined") toast("Opslaan geannuleerd");
    else if (c === "rate_limited") toast("Er staat al een opslagvraag open");
    else if (c === "unavailable" || c === "not_granted" || c === "capability_disabled") toast("Bestanden opslaan kan niet in deze weergave");
    else toast("Excel maken mislukt: " + ((e && e.message) || "onbekende fout"));
  } finally { btn.disabled = false; btn.textContent = "Excel"; }
}
document.getElementById("excel").addEventListener("click", exportExcel);

    cfg("imports", (d) => (S.imports = (d && d.list) || []));

    db.collection("bank").onSnapshot((q) => { const o = {}; q.docs.forEach((d) => { o[d.id] = (d.data() || {}).txs || []; }); S.bank = o; render(); }, onErr);

  }

  setTimeout(() => { loadFees(false); loadPaypal(); }, db ? 1500 : 0);
})();
